; ------------------------------------------------------------------------
;
;	Win11 Widgets for Rainmeter - Battery (large)
;		Author   - ketamine
;		Based on - Win10 Widgets by TJ Markham (http://win10widgets.com)
;		License  - Creative Commons BY-NC-SA 4.0
;
; ------------------------------------------------------------------------

; Known bug(s):
; - When "Not charging" is shown in Windows, "Charging" is shown in the 
;	widget. Looked at "PowerState=Status" and "PowerState=Status2" from 
;	the Power plug-in, but they provided no indication as to when "Not 
;	charging" should be shown.
; - When "battery saver" is active, no additional icon is shown. Looked 
;	at "PowerState=Status" and "PowerState=Status2" from the Power 
;	plug-in, but they provided no indication as to when "battery saver" 
;	was active.
; - When battery is charging, Windows shows the time until the battery is
;	fully charged whereas the widget just shows "Charging". Unaware of a 
;	way to replicate this Windows functionality in Rainmeter at time of 
;	release.
; - While the Windows battery icon shows "low" and "very low" battery 
;	level warning icons, the widget battery icon does not. Looked at 
;	"PowerState=Status" and "PowerState=Status2" from the Power plug-in,
;	but they provided no indication as to when the "low" and "very low" 
;	battery thresholds were reached. Since these values vary from system 
;	to system, this feature cannot be properly implemented by 
;	"hard coding" the threshold levels.

[Rainmeter]
Update=1000
; Context menu options to set the background style of all widgets (see backgroundStyles.ini).
ContextTitle=#BgTitleNormal#
ContextAction=#BgSetNormal#
ContextTitle2=#BgTitleOpaque#
ContextAction2=#BgSetOpaque#
ContextTitle3=#BgTitleClear#
ContextAction3=#BgSetClear#
ContextTitle4=#BgTitleBlur#
ContextAction4=#BgSetBlur#
ContextTitle5=#BgTitleAcrylic#
ContextAction5=#BgSetAcrylic#

[Metadata]
Name=Battery (large)
Author=ketamine (based on Win10 Widgets by TJ Markham)
Information=Displays the current battery status.
License=Creative Commons BY-NC-SA 4.0
Version=1.1.3

[Variables]
@Include1=#@#variables.ini
@Include2=#@#styles.ini
@Include3=#@#background.ini
CoreFilePath=""#CURRENTPATH#Battery-Large.ini""
BackgroundHeight=78
BatteryIconColor=#SolidWhite#
hrS=s
minS=s
BatteryIconSize=36
BatteryIconX=16
BatteryIconYOffset=12
LeftPadding=81
TopPadding=5
AutoBorder=1


; ------------------------------------------------------------------------
; MEASURES
; ------------------------------------------------------------------------

[MeasureBatteryACLine]
; Returns the status of the AC Line (0 for battery or 1 when plugged in).
; Controls the charging vs. discharging functionality.
Measure=Plugin
Plugin=PowerPlugin
PowerState=ACLine
IfEqualValue=1
IfEqualAction=[!HideMeterGroup TimeRemaining][!HideMeter Remaining][!ShowMeter ChargingStatus][!HideMeter ChargedStatus][!HideMeter Calculating][!UpdateMeasure MeasureBatteryIcon]
IfBelowValue=1
IfBelowAction=[!HideMeter ChargingStatus][!HideMeter ChargedStatus][!ShowMeter Calculating][!UpdateMeasure MeasureBatteryIcon]

[MeasureBatteryPercent]
; Returns the percentage of charge remaining in the battery.
; Controls the visibility of the "Charged" text.
Measure=Plugin
Plugin=PowerPlugin
PowerState=Percent
OnChangeAction=[!UpdateMeasure MeasureBatteryIcon][!UpdateMeter MeterBatteryPercent][!UpdateMeter Remaining]
IfCondition=(MeasureBatteryPercent=100) && (MeasureBatteryACLine=1)
IfTrueAction=[!HideMeterGroup TimeRemaining][!HideMeter ChargingStatus][!ShowMeter ChargedStatus]
IfConditionMode=1

[MeasureBatteryHours]
; Returns the estimated number of hours the battery will last.
; Controls the plurality of the hour measurement.
; Controls the visibility of the hour measurement.
Measure=Plugin
Plugin=PowerPlugin
PowerState=Lifetime
Substitute="Unknown":"-1","":"-1"
Format=%#H
OnChangeAction=[!UpdateMeter MeterBatteryHours]
IfMatch=^1$
IfMatchAction=!SetVariable hrS ""
IfNotMatchAction=!SetVariable hrS "s"
IfMatch2=^0$
IfMatchAction2=[!HideMeter MeterBatteryHours]
IfCondition=([MeasureBatteryHours] > 0) && (MeasureBatteryACLine = 0)
IfTrueAction=[!ShowMeter MeterBatteryHours][!ShowMeter Remaining][!HideMeter Calculating]
IfCondition2=([MeasureBatteryHours] < 0) && (MeasureBatteryACLine = 0)
IfTrueAction2=[!HideMeter MeterBatteryHours][!HideMeter Remaining][!ShowMeter Calculating]
DynamicVariables=1
IfConditionMode=1

[MeasureBatteryMinutes]
; Returns the estimated number of minutes the battery will last.
; Controls the plurality of the minute measurement.
; Controls the visibility of the minute measurement.
Measure=Plugin
Plugin=PowerPlugin
PowerState=Lifetime
Substitute="Unknown":"-1","":"-1"
Format=%#M
OnChangeAction=[!UpdateMeter MeterBatteryMinutes]
IfMatch=^1$
IfMatchAction=!SetVariable minS ""
IfNotMatchAction=!SetVariable minS "s"
IfMatch2=^0$
IfMatchAction2=[!HideMeter MeterBatteryMinutes]
IfCondition=([MeasureBatteryMinutes] > 0) && (MeasureBatteryACLine = 0)
IfTrueAction=[!ShowMeter MeterBatteryMinutes][!ShowMeter Remaining][!HideMeter Calculating]
IfCondition2=([MeasureBatteryMinutes] < 0) && (MeasureBatteryACLine = 0)
IfTrueAction2=[!HideMeter MeterBatteryMinutes][!HideMeter Remaining][!ShowMeter Calculating]
DynamicVariables=1
IfConditionMode=1

[MeasureBatteryIcon]
; Returns which battery glyph to show: 0-10 = discharging (per 10%), 20-29 = charging (per 10%).
; Substitute turns it into the matching Segoe Fluent Icons character.
Measure=Calc
Formula=(MeasureBatteryACLine = 1) ? (20 + Min(Floor(MeasureBatteryPercent/10), 9)) : Round(MeasureBatteryPercent/10)
RegExpSubstitute=1
Substitute="^0$":"[\xE850]","^1$":"[\xE851]","^2$":"[\xE852]","^3$":"[\xE853]","^4$":"[\xE854]","^5$":"[\xE855]","^6$":"[\xE856]","^7$":"[\xE857]","^8$":"[\xE858]","^9$":"[\xE859]","^10$":"[\xE83F]","^20$":"[\xE85A]","^21$":"[\xE85B]","^22$":"[\xE85C]","^23$":"[\xE85D]","^24$":"[\xE85E]","^25$":"[\xE85F]","^26$":"[\xE860]","^27$":"[\xE861]","^28$":"[\xE862]","^29$":"[\xE83E]"
OnChangeAction=[!UpdateMeter BatteryIcon][!Redraw]


; ------------------------------------------------------------------------
; METERS - Battery Icon
; ------------------------------------------------------------------------

[BatteryIcon]
; Shows the battery icon (Windows 11 style, Segoe Fluent Icons) with its charge level and charging state.
Meter=String
MeterStyle=StyleFluentIcon
MeasureName=MeasureBatteryIcon
X=#BatteryIconX#
Y=(#TopPadding#+#BatteryIconYOffset#)
FontSize=#BatteryIconSize#
FontColor=#BatteryIconColor#
Text=%1
DynamicVariables=1

; ------------------------------------------------------------------------
; METERS - Text
; ------------------------------------------------------------------------

[MeterBatteryPercent]
; Shows the percentage of charge remaining in the battery.
Meter=String
MeterStyle=StyleBigText
MeasureName=MeasureBatteryPercent
X=#LeftPadding#
Y=#TopPadding#
Text="%1"
UpdateDivider=-1

[Percent]
; Shows "%".
Meter=String
MeterStyle=StyleBigText
X=-16R
Y=0r
Text="%"
UpdateDivider=-1

[MeterBatteryHours]
; Shows the estimated number of hours the battery will last.
Meter=String
MeterStyle=StyleSmallText
MeasureName=MeasureBatteryHours
X=5R
Y=12r
Group=TimeRemaining
Text="%1 hour#hrS#"
DynamicVariables=1
UpdateDivider=-1

[MeterBatteryMinutes]
; Shows the estimated number of minutes the battery will last.
Meter=String
MeterStyle=StyleSmallText
MeasureName=MeasureBatteryMinutes
X=0R
Y=0r
Group=TimeRemaining
Text="%1 minute#minS#"
DynamicVariables=1
UpdateDivider=-1

[Remaining]
; Shows "Remaining".
Meter=String
MeterStyle=StyleSmallText
X=[MeterBatteryHours:X]
Y=20r
Text="remaining"
DynamicVariables=1
UpdateDivider=-1

[ChargingStatus]
; Shows "Charging".
Meter=String
MeterStyle=StyleSmallText
X=0r
Y=(#TopPadding#+22)
Text="Charging"
UpdateDivider=-1

[ChargedStatus]
; Shows "Fully charged".
Meter=String
MeterStyle=StyleSmallText
X=0r
Y=[ChargingStatus:Y]
Text="Fully charged"
UpdateDivider=-1

[Calculating]
; Shows "Calculating...".
Meter=String
MeterStyle=StyleSmallText
X=0r
Y=[ChargingStatus:Y]
Text="Calculating..."
UpdateDivider=-1
