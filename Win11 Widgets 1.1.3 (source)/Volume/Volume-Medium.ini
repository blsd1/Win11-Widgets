; ------------------------------------------------------------------------
;
;	Win11 Widgets for Rainmeter - Volume (medium)
;		Author   - ketamine
;		Based on - Win10 Widgets by TJ Markham (http://win10widgets.com)
;		License  - Creative Commons BY-NC-SA 4.0
;
; ------------------------------------------------------------------------

; Known bug(s):
; - Audio device name isn't shown (don't know how to get this value).
; - When the volume is turned all the way down, sometimes the volume 
;	bar/number shows a value greater than 0 (usually hangs on "2"). This 
;	is an artifact of the method used to maintain the volume bar/number 
;	when the volume is muted (a feature derived from the Windows 10 
;	volume control behavior).

[Rainmeter]
MouseActionCursor=0
Update=1000
; Context menu options to set the background style of all widgets (see backgroundStyles.ini).
ContextTitle=#BgTitleNormal#
ContextAction=#BgSetNormal#
ContextTitle2=#BgTitleOpaque#
ContextAction2=#BgSetOpaque#
ContextTitle3=#BgTitleClear#
ContextAction3=#BgSetClear#
ContextTitle4=#BgTitleBlur#
ContextAction4=#BgSetBlur#
ContextTitle5=#BgTitleAcrylic#
ContextAction5=#BgSetAcrylic#

[Metadata]
Name=Volume (medium)
Author=ketamine (based on Win10 Widgets by TJ Markham)
Information=Displays the current volume status.
License=Creative Commons BY-NC-SA 4.0
Version=1.1.3

[Variables]
@Include1=#@#systemColors.ini
@Include2=#@#variables.ini
@Include3=#@#styles.ini
@Include4=#@#background.ini
CoreFilePath=""#CURRENTPATH#Volume-Medium.ini""
BackgroundHeight=86
MeterBarColor=#WindowsColorLight#
LeftPadding=20
TopPadding=38
AutoBorder=1


; ------------------------------------------------------------------------
; MEASURES
; ------------------------------------------------------------------------

[MeasureWin7Audio]
; Returns name of audio device (string) and volume level (number).
; Controls the Volume icon glyph.
Measure=Plugin
Plugin=Win7AudioPlugin
OnChangeAction=[!UpdateMeter VolumeDevice][!UpdateMeasure MeasureUpdateVolumeMeters]
; -1 (muted)
IfCondition=(MeasureWin7Audio < 0)
IfTrueAction=[!SetOption VolumeIcon Text "[\xE74F]"][!UpdateMeter VolumeIcon]
; 0
IfCondition2=(MeasureWin7Audio = 0)
IfTrueAction2=[!SetOption VolumeIcon Text "[\xE992]"][!UpdateMeter VolumeIcon]
; 1-32
IfCondition3=(MeasureWin7Audio >= 1) && (MeasureWin7Audio <= 32)
IfTrueAction3=[!SetOption VolumeIcon Text "[\xE993]"][!UpdateMeter VolumeIcon]
; 33-65
IfCondition4=(MeasureWin7Audio >= 33) && (MeasureWin7Audio <= 65)
IfTrueAction4=[!SetOption VolumeIcon Text "[\xE994]"][!UpdateMeter VolumeIcon]
; 66-100
IfCondition5=(MeasureWin7Audio >= 66)
IfTrueAction5=[!SetOption VolumeIcon Text "[\xE995]"][!UpdateMeter VolumeIcon]

[MeasureUpdateVolumeMeters]
; Controls meters representing volume (bar and number).
; Mouse actions update this measure instead of the meter group, so muting (-1) keeps the last bar/number.
Measure=String
; >=0
IfCondition=(MeasureWin7Audio >= 0)
IfTrueAction=[!UpdateMeterGroup VolumeMeters]
IfConditionMode=1
UpdateDivider=-1


; ------------------------------------------------------------------------
; METERS - Volume Icon
; ------------------------------------------------------------------------

[VolumeIcon]
; Shows the Windows 11 volume icon (Segoe Fluent Icons); glyph is set by [MeasureWin7Audio] (muted / 0 / 1-32 / 33-65 / 66-100).
Meter=String
MeterStyle=StyleFluentIcon
X=(#LeftPadding#+2)
Y=(#TopPadding#+6)
FontSize=16
Text=[\xE995]
UpdateDivider=-1


; ------------------------------------------------------------------------
; METERS - Bar
; ------------------------------------------------------------------------

[VolumeBar]
; Invisible bar that holds the slider geometry (drawn by [VolumeTrack] and [VolumeBarCap]). Maintains position when muted.
Meter=Bar
MeasureName=MeasureWin7Audio
X=(#LeftPadding#+45)
Y=(#TopPadding#+12)
W=217
H=11
SolidColor=#Transparent#
Group=VolumeMeters | WindowsColorGroup
BarColor=0,0,0,0
BarOrientation=Horizontal
DynamicVariables=1
UpdateDivider=-1

[VolumeBarEnd]
; Shows the end of volume bar (to accommodate volume bar "cap").
Meter=Image
X=([VolumeBar:X]+[VolumeBar:W])
Y=[VolumeBar:Y]
W=[VolumeBar:H]
H=[VolumeBar:H]
SolidColor=#Transparent#
UpdateDivider=-1

[VolumeTrack]
; Windows 11 style slider track: rounded grey track with accent-colored fill up to the current volume.
Meter=Shape
X=[VolumeBar:X]
Y=([VolumeBar:Y]+([VolumeBar:H]/2)-2)
Shape=Rectangle 0,0,([VolumeBar:W]+[VolumeBar:H]),4,2 | Fill Color #TrackColor# | StrokeWidth 0
Shape2=Rectangle 0,0,(Max(([MeasureWin7Audio:]*[VolumeBar:W]/100)+([VolumeBar:H]/2),1)),4,2 | Fill Color #MeterBarColor# | StrokeWidth 0
Group=VolumeMeters | WindowsColorGroup
DynamicVariables=1
UpdateDivider=-1

[VolumeBarSenseBackOverlay]
; Shows transparent white overlay when mouse is over volume bar.
Meter=Image
X=[VolumeBar:X]
Y=[VolumeBar:Y]
W=([VolumeBar:W]+[VolumeBarEnd:W])
H=[VolumeBar:H]
Hidden=1
SolidColor=#Transparent#
UpdateDivider=-1

[VolumeBarSenseBack0]
; Area covering entire widget. 
; If mouse leaves or is released, volume changes will stop. 
; If mouse is scrolled, volume will change accordingly (in increments of 2).
Meter=Image
X=0
Y=0
W=#BackgroundWidth#
H=#BackgroundHeight#
SolidColor=#Transparent#
LeftMouseUpAction=[!HideMeter VolumeBarSenseBackOverlay][!HideMeterGroup Sense]
MouseLeaveAction=[!HideMeter VolumeBarSenseBackOverlay][!HideMeterGroup Sense]
MouseScrollUpAction=[!CommandMeasure MeasureWin7Audio "ChangeVolume 2"][!UpdateMeasure MeasureWin7Audio][!UpdateMeasure MeasureUpdateVolumeMeters][!UpdateMeter VolumeIcon][!Redraw]
MouseScrollDownAction=[!CommandMeasure MeasureWin7Audio "ChangeVolume -2"][!UpdateMeasure MeasureWin7Audio][!UpdateMeasure MeasureUpdateVolumeMeters][!UpdateMeter VolumeIcon][!Redraw]
UpdateDivider=-1

[VolumeBarSenseBack1]
; Area where clicks on the volume bar will be sensed.
; Extends a few pixels above and below the visible bar.
Meter=Image
X=[VolumeBar:X]
Y=([VolumeBar:Y]-10)
W=([VolumeBar:W]+[VolumeBarEnd:W])
H=([VolumeBar:H]+2*10)
SolidColor=#Transparent#
LeftMouseDownAction=[!CommandMeasure MeasureWin7Audio "SetVolume $MouseX:%$"][!UpdateMeasure MeasureWin7Audio][!UpdateMeasure MeasureUpdateVolumeMeters][!UpdateMeter VolumeIcon][!Redraw][!ShowMeterGroup Sense]
LeftMouseUpAction=[!HideMeterGroup Sense]
MouseOverAction=[!ShowMeter VolumeBarSenseBackOverlay]
MouseLeaveAction=[!HideMeter VolumeBarSenseBackOverlay]
UpdateDivider=-1

[VolumeBarCap]
; Shows round Windows 11 style slider thumb (accent-colored dot in a dark circle).
; When clicked, can be "dragged" to change volume (i.e. sense group is shown).
Meter=Shape
X=([VolumeBar:X]+(Max([MeasureWin7Audio:],0)*([VolumeBar:W]/100))+([VolumeBar:H]/2)-10)
Y=([VolumeBar:Y]+([VolumeBar:H]/2)-10)
Shape=Ellipse 10,10,9.5 | Fill Color 69,69,69 | StrokeWidth 1 | Stroke Color 255,255,255,24
Shape2=Ellipse 10,10,5 | Fill Color #MeterBarColor# | StrokeWidth 0
Group=VolumeMeters | WindowsColorGroup
LeftMouseDownAction=[!ShowMeterGroup Sense]
DynamicVariables=1
UpdateDivider=-1


; ------------------------------------------------------------------------
; METERS - Text/Buttons
; ------------------------------------------------------------------------

[VolumeDevice]
; Shows the current sound device.
Meter=String
MeterStyle=StyleSmallText | StyleWhiteText
MeasureName=MeasureWin7Audio
X=10
Y=13
Text="%1"
ClipString=2
ClipStringW=(#BackgroundWidth#-30)
UpdateDivider=-1

[VolumePercent]
; Shows the volume level.
Meter=String
MeterStyle=StyleMediumText | StyleCenterAlign
X=([VolumeBarEnd:X]+[VolumeBarEnd:W]+33)
Y=#TopPadding#
W=47
H=34
Text=[MeasureWin7Audio:]
Group=VolumeMeters
DynamicVariables=1
UpdateDivider=-1

[VolumeButton]
; Transparent overlay on top of volume icon; toggles mute when clicked.
Meter=Image
X=#LeftPadding#
Y=#TopPadding#
W=32
H=32
SolidColor=#Transparent#
Group=SpotifyOn
LeftMouseUpAction=[!CommandMeasure MeasureWin7Audio "ToggleMute"][!UpdateMeasure MeasureWin7Audio][!UpdateMeasure MeasureUpdateVolumeMeters][!UpdateMeter VolumeIcon][!Redraw]
UpdateDivider=-1


; ------------------------------------------------------------------------
; METERS - VolumeBarSense
; ------------------------------------------------------------------------
; Meters below form a 101-part (0 to 100, inclusive) invisible bar that, when not hidden, changes the volume based on which part of the bar the mouse is over.

[VolumeBarSense0]
Meter=Image
MeterStyle=StyleVolumeBarSense
X=[VolumeBar:X]
Y=0
MouseOverAction=[!CommandMeasure MeasureWin7Audio "SetVolume 0"][!UpdateMeasure MeasureWin7Audio][!UpdateMeasure MeasureUpdateVolumeMeters][!UpdateMeter VolumeIcon][!Redraw]

[VolumeBarSense1]
Meter=Image
MeterStyle=StyleVolumeBarSense
MouseOverAction=[!CommandMeasure MeasureWin7Audio "SetVolume 1"][!UpdateMeasure MeasureWin7Audio][!UpdateMeasure MeasureUpdateVolumeMeters][!UpdateMeter VolumeIcon][!Redraw]

[VolumeBarSense2]
Meter=Image
MeterStyle=StyleVolumeBarSense
W=3
MouseOverAction=[!CommandMeasure MeasureWin7Audio "SetVolume 2"][!UpdateMeasure MeasureWin7Audio][!UpdateMeasure MeasureUpdateVolumeMeters][!UpdateMeter VolumeIcon][!Redraw]

