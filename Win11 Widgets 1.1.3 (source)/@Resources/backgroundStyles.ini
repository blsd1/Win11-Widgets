; About:
;	Background style of all widgets, like TranslucentTB does for the
;	taskbar: Normal, Opaque, Clear, Blur or Acrylic. Included through
;	"variables.ini", so every skin can switch it from its right-click menu:
;		ContextTitleN=#BgTitleNormal#
;		ContextActionN=#BgSetNormal#
;	(one pair per style). The choice is saved in "variables.ini" and every
;	Win11 Widgets skin is refreshed.

[Variables]
BgVariablesFile=""#@#variables.ini""
; Card colour of each style (Blur/Acrylic also get a backdrop tint, AARRGGBB).
NormalColor=32,32,32,235
OpaqueColor=0,0,0,255
ClearColor=32,32,32,110
BlurColor=32,32,32,110
BlurTint=00000000
AcrylicColor=32,32,32,30
AcrylicTint=50202020
; Graph background of each style (Performance widgets): a darker inset on Normal, the card colour on Opaque,
; and see-through on the translucent styles so the card shows through.
NormalGraph=25,25,25
OpaqueGraph=0,0,0
ClearGraph=0,0,0,0
BlurGraph=0,0,0,0
AcrylicGraph=0,0,0,0
; Menu actions: save the style (and mark it "(current)" in every menu), then refresh the widgets.
; Leaving Blur/Acrylic first removes the backdrop ([MeasureClearBackdrop] refreshes when done).
BgSetNormal=[!WriteKeyValue Variables BackgroundStyle Normal #BgVariablesFile#][!WriteKeyValue Variables BackgroundColor "#NormalColor#" #BgVariablesFile#][!WriteKeyValue Variables GraphBackgroundColor "#NormalGraph#" #BgVariablesFile#][!WriteKeyValue Variables BackdropTint 00000000 #BgVariablesFile#][!WriteKeyValue Variables BgTitleNormal "Background: Normal (current)" #BgVariablesFile#][!WriteKeyValue Variables BgTitleOpaque "Background: Opaque" #BgVariablesFile#][!WriteKeyValue Variables BgTitleClear "Background: Clear" #BgVariablesFile#][!WriteKeyValue Variables BgTitleBlur "Background: Blur" #BgVariablesFile#][!WriteKeyValue Variables BgTitleAcrylic "Background: Acrylic" #BgVariablesFile#][!CommandMeasure MeasureClearBackdrop Run]
BgSetOpaque=[!WriteKeyValue Variables BackgroundStyle Opaque #BgVariablesFile#][!WriteKeyValue Variables BackgroundColor "#OpaqueColor#" #BgVariablesFile#][!WriteKeyValue Variables GraphBackgroundColor "#OpaqueGraph#" #BgVariablesFile#][!WriteKeyValue Variables BackdropTint 00000000 #BgVariablesFile#][!WriteKeyValue Variables BgTitleNormal "Background: Normal" #BgVariablesFile#][!WriteKeyValue Variables BgTitleOpaque "Background: Opaque (current)" #BgVariablesFile#][!WriteKeyValue Variables BgTitleClear "Background: Clear" #BgVariablesFile#][!WriteKeyValue Variables BgTitleBlur "Background: Blur" #BgVariablesFile#][!WriteKeyValue Variables BgTitleAcrylic "Background: Acrylic" #BgVariablesFile#][!CommandMeasure MeasureClearBackdrop Run]
BgSetClear=[!WriteKeyValue Variables BackgroundStyle Clear #BgVariablesFile#][!WriteKeyValue Variables BackgroundColor "#ClearColor#" #BgVariablesFile#][!WriteKeyValue Variables GraphBackgroundColor "#ClearGraph#" #BgVariablesFile#][!WriteKeyValue Variables BackdropTint 00000000 #BgVariablesFile#][!WriteKeyValue Variables BgTitleNormal "Background: Normal" #BgVariablesFile#][!WriteKeyValue Variables BgTitleOpaque "Background: Opaque" #BgVariablesFile#][!WriteKeyValue Variables BgTitleClear "Background: Clear (current)" #BgVariablesFile#][!WriteKeyValue Variables BgTitleBlur "Background: Blur" #BgVariablesFile#][!WriteKeyValue Variables BgTitleAcrylic "Background: Acrylic" #BgVariablesFile#][!CommandMeasure MeasureClearBackdrop Run]
BgSetBlur=[!WriteKeyValue Variables BackgroundStyle Blur #BgVariablesFile#][!WriteKeyValue Variables BackgroundColor "#BlurColor#" #BgVariablesFile#][!WriteKeyValue Variables GraphBackgroundColor "#BlurGraph#" #BgVariablesFile#][!WriteKeyValue Variables BackdropTint #BlurTint# #BgVariablesFile#][!WriteKeyValue Variables BgTitleNormal "Background: Normal" #BgVariablesFile#][!WriteKeyValue Variables BgTitleOpaque "Background: Opaque" #BgVariablesFile#][!WriteKeyValue Variables BgTitleClear "Background: Clear" #BgVariablesFile#][!WriteKeyValue Variables BgTitleBlur "Background: Blur (current)" #BgVariablesFile#][!WriteKeyValue Variables BgTitleAcrylic "Background: Acrylic" #BgVariablesFile#][!RefreshGroup Win11Widgets]
BgSetAcrylic=[!WriteKeyValue Variables BackgroundStyle Acrylic #BgVariablesFile#][!WriteKeyValue Variables BackgroundColor "#AcrylicColor#" #BgVariablesFile#][!WriteKeyValue Variables GraphBackgroundColor "#AcrylicGraph#" #BgVariablesFile#][!WriteKeyValue Variables BackdropTint #AcrylicTint# #BgVariablesFile#][!WriteKeyValue Variables BgTitleNormal "Background: Normal" #BgVariablesFile#][!WriteKeyValue Variables BgTitleOpaque "Background: Opaque" #BgVariablesFile#][!WriteKeyValue Variables BgTitleClear "Background: Clear" #BgVariablesFile#][!WriteKeyValue Variables BgTitleBlur "Background: Blur" #BgVariablesFile#][!WriteKeyValue Variables BgTitleAcrylic "Background: Acrylic (current)" #BgVariablesFile#][!RefreshGroup Win11Widgets]


; ------------------------------------------------------------------------
; MEASURES
; ------------------------------------------------------------------------

[MeasureClearBackdrop]
; Removes the blur/acrylic backdrop from all widgets, then refreshes them (used when leaving Blur/Acrylic).
; Timeout: FinishAction (and so the refresh) also runs if it hangs.
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "#@#Scripts\backdrop.ps1" -Style none -All
FinishAction=[!RefreshGroup Win11Widgets]
Timeout=30000
State=Hide
UpdateDivider=-1
