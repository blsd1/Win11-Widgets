; About:
; 	Replaces the Context Actions of an included skin with just the
;	background style options (see backgroundStyles.ini), when included
;	after a skin that has up to 2 own actions (+ separator + 5 styles).
;	The empty 6th title ends the list, hiding the included skin's rest.

[Rainmeter]
ContextTitle=#BgTitleNormal#
ContextAction=#BgSetNormal#
ContextTitle2=#BgTitleOpaque#
ContextAction2=#BgSetOpaque#
ContextTitle3=#BgTitleClear#
ContextAction3=#BgSetClear#
ContextTitle4=#BgTitleBlur#
ContextAction4=#BgSetBlur#
ContextTitle5=#BgTitleAcrylic#
ContextAction5=#BgSetAcrylic#
ContextTitle6=""
ContextAction6=[]
