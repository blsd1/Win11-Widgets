; Based on:
;	https://forum.rainmeter.net/viewtopic.php?t=21303

; About:
;	Retrieves Windows accent colors and makes them available as variables 
;	to skins that include the "systemColors.ini" file. Also sends updates 
;	to meter groups when the Windows accent color is changed.

[Variables]
; Skin updates between accent colour checks (30 = 30 s at Update=1000; skins with a faster Update raise it).
AccentCheckDivider=30
WindowsColor=[MeasureWindowsColor]
WindowsColorText=[MeasureWindowsColorText]
WindowsColorDark=[MeasureWindowsColorDark]
WindowsColorLight=[MeasureWindowsColorLight]


; ------------------------------------------------------------------------
; MEASURES
; ------------------------------------------------------------------------

[MeasureColorTrigger]
; Updates Windows accent palette every #AccentCheckDivider# skin updates (about every 30 seconds).
Measure=String
OnUpdateAction=[!CommandMeasure MeasurePaletteRegistry Run]
UpdateDivider=#AccentCheckDivider#

[MeasurePaletteRegistry]
; Returns Windows accent palette.
Measure=Plugin
Plugin=Plugin\RunCommand
Parameter=C:\Windows\System32\reg.exe query HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Accent /v AccentPalette
OutputType=ANSI
FinishAction=[!UpdateMeasure MeasureWindowsColor][!UpdateMeasure MeasureWindowsColorText][!UpdateMeasure MeasureWindowsColorDark][!UpdateMeasure MeasureWindowsColorLight]
UpdateDivider=-1

; The substitutes below use greedy matching (no "U" flag), so the trailing ".*" also drops the line breaks
; after the registry value and the result is a bare RRGGBB.
; Palette options:
; "\1\2\3"	Windows accent color for text (Windows 11 dark mode)
; "\5\6\7"	Light Windows accent color (Windows 11 dark mode controls)
; "\9\10\11"	Windows 10 accent color for text
; "\13\14\15"	Primary Windows accent color
; "\17\18\19"
; "\21\22\23"	Taskbar color (when it's not black)
; "\25\26\27"	Text input color
; "\29\30\31"

[MeasureWindowsColorText]
; Returns Windows accent color for text.
Measure=String
String=[MeasurePaletteRegistry]
DynamicVariables=1
RegExpSubstitute=1
Substitute="(?si).*REG_BINARY\s*([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2}).*":"\1\2\3"
UpdateDivider=-1
OnChangeAction=[!UpdateMeterGroup WindowsTextColorGroup]

[MeasureWindowsColorDark]
; Returns dark Windows accent color.
Measure=String
String=[MeasurePaletteRegistry]
DynamicVariables=1
RegExpSubstitute=1
Substitute="(?si).*REG_BINARY\s*([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2}).*":"\25\26\27"
UpdateDivider=-1
OnChangeAction=[!UpdateMeterGroup WindowsDarkColorGroup]

[MeasureWindowsColor]
; Returns primary Windows accent color.
Measure=String
String=[MeasurePaletteRegistry]
DynamicVariables=1
RegExpSubstitute=1
Substitute="(?si).*REG_BINARY\s*([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2}).*":"\13\14\15"
UpdateDivider=-1
OnChangeAction=[!UpdateMeterGroup WindowsColorGroup]

[MeasureWindowsColorLight]
; Returns light Windows accent color (used by Windows 11 controls in dark mode).
Measure=String
String=[MeasurePaletteRegistry]
DynamicVariables=1
RegExpSubstitute=1
Substitute="(?si).*REG_BINARY\s*([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2})([[:xdigit:]]{2}).*":"\5\6\7"
UpdateDivider=-1
OnChangeAction=[!UpdateMeterGroup WindowsColorGroup]
