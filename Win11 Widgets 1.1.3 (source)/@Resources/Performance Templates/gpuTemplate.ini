; About:
;	Template for GPU performance monitor (uses 5th monitor slot).
;	Requires Rainmeter 4.0+ (UsageMonitor plugin).

[Variables]
GraphMeasure5=MeasureGPU


; ------------------------------------------------------------------------
; MEASURES
; ------------------------------------------------------------------------

[MeasureGPURaw]
; Returns GPU utilization summed over all engines (3D, Copy, Video...), so it can read higher than
; Task Manager (busiest engine). UsageMonitor names GPU instances by process, so engines can't be filtered.
Measure=Plugin
Plugin=UsageMonitor
Alias=GPU
Index=0
OnUpdateAction=[!UpdateMeasure MeasureGPU]
UpdateDivider=1

[MeasureGPU]
; Clamps GPU utilization to 0-100 percent.
Measure=Calc
Formula=Clamp(MeasureGPURaw, 0, 100)
MinValue=0
MaxValue=100
OnUpdateAction=[!UpdateMeter Graph5][!UpdateMeter GraphBackground5][!UpdateMeter Value5]
UpdateDivider=-1


; ------------------------------------------------------------------------
; METERS
; ------------------------------------------------------------------------

[Graph5]
Hidden=0

[GraphBackground5]
Hidden=0

[Top5]
Hidden=0

[Left5]
Hidden=0

[Bottom5]
Hidden=0

[Right5]
Hidden=0

[Label5]
Hidden=0

[Value5]
Hidden=0
