; About:
; 	Shows a Windows 11 style background (rounded card with a subtle 1px
;	border) for skins that include the "background.ini" file.

; Required Variables:
;	- BackgroundWidth
;	- BackgroundHeight


; ------------------------------------------------------------------------
; MEASURES
; ------------------------------------------------------------------------

[MeasureAutoBorder]
; Make skin aware of "current" screen coordinates.
; (Windows 11 cards are rounded on all sides, so borders no longer adapt to screen edges.)
Measure=Calc
IfCondition=(#AutoBorder# = 1)
IfTrueAction=[!WriteKeyValue "#CURRENTCONFIG#" AutoSelectScreen 1 "#SETTINGSPATH#Rainmeter.ini"]
UpdateDivider=-1

[MeasureBackdropStyle]
; Gives the skin window a blur/acrylic backdrop when that background style is chosen (backgroundStyles.ini).
; Skins that size their card at run time set BackdropReady=0 in their [Variables] (skipped at load, so the
; backdrop isn't first clipped to the default height), then set it to 1 and update this once the height is known.
Measure=String
String=#BackgroundStyle#|#BackdropReady#
IfMatch=^(Blur|Acrylic)\|1$
IfMatchAction=[!SetVariable BackdropBusy 1][!CommandMeasure MeasureBackdrop Run]
IfMatchMode=1
DynamicVariables=1
UpdateDivider=-1

[MeasureBackdrop]
; Applies the backdrop, clipped to the card. Skins that resize their card wait until BackdropBusy is 0
; (a Run while busy is ignored), then set BackgroundHeight and update this and [MeasureBackdropStyle].
; Timeout: a hung run is stopped after 30 s (room for the one-time build), so BackdropBusy can't stay 1.
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "#@#Scripts\backdrop.ps1" -Style #BackgroundStyle# -Tint #BackdropTint# -Width #BackgroundWidth# -Height #BackgroundHeight# -Radius #CornerRadius# -Skin "#CURRENTPATH##CURRENTFILE#"
FinishAction=[!SetVariable BackdropBusy 0]
Timeout=30000
State=Hide
DynamicVariables=1
UpdateDivider=-1


; ------------------------------------------------------------------------
; METERS
; ------------------------------------------------------------------------

[BackgroundBox]
; Shows rounded background card with border.
Meter=Shape
X=0
Y=0
Shape=Rectangle 0.5,0.5,(#BackgroundWidth#-1),(#BackgroundHeight#-1),#CornerRadius# | Fill Color #BackgroundColor# | StrokeWidth 1 | Stroke Color #BorderColor#
UpdateDivider=-1
