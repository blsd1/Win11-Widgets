[Metadata]
Name=HardDrive (small)
Author=ketamine (based on Win10 Widgets by TJ Markham)
Information=Displays the free space on the selected Hard Drive.
License=Creative Commons BY-NC-SA 4.0
Version=1.1.3

[Variables]
@Include=HardDrive-Medium.ini
BackgroundHeight=49


; ------------------------------------------------------------------------
; METERS
; ------------------------------------------------------------------------

[LabelDisk]
FontSize=11
FontFace=Segoe UI Variable Text
FontWeight=600
Y=(#TopPadding#+10)

[FreeDisk]
FontSize=11
X=5R

[TotalDisk]
Y=0r

