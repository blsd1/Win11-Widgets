; Known bug(s):
; - CPU frequency isn't shown as it is in the Windows 10 Task Manager 
;	"Performance" tab. Tried to get this data using the PerfMon plug-in, 
;	but the values returned by "Processor Information - Processor 
;	Frequency" did not seem to align with what the Windows 10 Task 
;	Manager was reporting.

[Rainmeter]
Update=1000
; Context menu options to set the background style of all widgets (see backgroundStyles.ini).
ContextTitle=#BgTitleNormal#
ContextAction=#BgSetNormal#
ContextTitle2=#BgTitleOpaque#
ContextAction2=#BgSetOpaque#
ContextTitle3=#BgTitleClear#
ContextAction3=#BgSetClear#
ContextTitle4=#BgTitleBlur#
ContextAction4=#BgSetBlur#
ContextTitle5=#BgTitleAcrylic#
ContextAction5=#BgSetAcrylic#

[Metadata]
Name=CPU (tiny)
Author=ketamine (based on Win10 Widgets by TJ Markham)
Information=Displays CPU information.
License=Creative Commons BY-NC-SA 4.0
Version=1.1.3

[Variables]
@Include1="#@#Performance Templates\performanceTemplateX4.ini"
@Include2="#@#Performance Templates\cpuTemplate.ini"
CoreFilePath=""#CURRENTPATH#CPU-Tiny.ini""
BackgroundHeight=62
AutoBorder=1
