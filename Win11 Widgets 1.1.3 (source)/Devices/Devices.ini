; About:
;	Shows the battery of wireless Logitech and SteelSeries devices
;	(and other headsets supported by HeadsetControl). Only connected
;	devices are shown; the card grows/shrinks to fit.
;	- Logitech mice/keyboards: read directly from the LIGHTSPEED / Unifying /
;	  Bolt receiver (HID++), G HUB is not needed.
;	- Headsets (SteelSeries Arctis, Logitech G, ...): read with HeadsetControl
;	  (@Resources\Tools\headsetcontrol.exe).

[Rainmeter]
Update=1000
AccurateText=1
; Shrink the window with the card (hidden rows), so a blur/acrylic backdrop doesn't fill the empty space below it.
DynamicWindowSize=1
ContextTitle="Refresh devices now"
ContextAction=[!CommandMeasure MeasureDevicesRefresh Run]
; Context menu options to set the background style of all widgets (see backgroundStyles.ini).
ContextTitle2="-"
ContextTitle3=#BgTitleNormal#
ContextAction3=#BgSetNormal#
ContextTitle4=#BgTitleOpaque#
ContextAction4=#BgSetOpaque#
ContextTitle5=#BgTitleClear#
ContextAction5=#BgSetClear#
ContextTitle6=#BgTitleBlur#
ContextAction6=#BgSetBlur#
ContextTitle7=#BgTitleAcrylic#
ContextAction7=#BgSetAcrylic#

[Metadata]
Name=Devices
Author=ketamine
Information=Shows the battery of connected wireless Logitech and SteelSeries devices (mouse, keyboard, headset).
License=Creative Commons BY-NC-SA 4.0
Version=1.1.3

[Variables]
@Include1=#@#systemColors.ini
@Include2=#@#variables.ini
@Include3=#@#styles.ini
@Include4=#@#background.ini
AutoBorder=1
BackgroundHeight=62
; The backdrop is applied by devices.lua once the card is sized (not at load with the default height above).
BackdropReady=0
; Seconds between battery checks (plugging a device in or out is picked up within ~2 seconds).
RefreshSeconds=30
; Approximate minutes for a full charge. Headsets charging over their cable (e.g. G733) can't report
; their real level, so it's estimated from the level before plugging in + time charging.
ChargeMinutes=180
MaxRows=4
RowsTop=10
RowHeight=46
RowsBottom=6
BarWidth=291
SuccessColor=108,203,95
CriticalColor=255,153,164


; ------------------------------------------------------------------------
; MEASURES
; ------------------------------------------------------------------------

[MeasureDevicesStart]
; Starts the background helper once when the skin loads.
Measure=Calc
Formula=1
OnUpdateAction=[!CommandMeasure MeasureDevicesHelper Run]
UpdateDivider=-1

[MeasureDevicesHelper]
; Starts the small background helper (DevicesHelper.cs, compiled on first use by deviceBattery.ps1).
; It writes the connected devices to %TEMP%\Win11Widgets\devices.txt every #RefreshSeconds# seconds and
; within ~2 seconds when a device is plugged in or removed. It exits by itself when this widget is unloaded;
; devices.lua runs this again if the helper stops writing.
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "#CURRENTPATH#deviceBattery.ps1" -Interval #RefreshSeconds# -ChargeMinutes #ChargeMinutes#
State=Hide
Timeout=60000
UpdateDivider=-1

[MeasureDevicesRefresh]
; Asks the helper to read right away ("Refresh devices now" menu item).
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "#CURRENTPATH#deviceBattery.ps1" -Refresh -Interval #RefreshSeconds# -ChargeMinutes #ChargeMinutes#
State=Hide
Timeout=30000
UpdateDivider=-1

[MeasureDevicesScript]
; Reads the helper's output every second and lays out one row per connected device.
; (Also keeps the helper running through a heartbeat file.)
Measure=Script
ScriptFile=#CURRENTPATH#devices.lua

[MeasureAccentWatch]
; Recolours the battery bars once the Windows accent colour is read, and whenever it changes.
Measure=String
String=[MeasureWindowsColorLight]
OnChangeAction=[!CommandMeasure MeasureDevicesScript "Redraw()"]
DynamicVariables=1

; ------------------------------------------------------------------------
; METERS
; ------------------------------------------------------------------------

[NoDevices]
; Shown while checking, or when no wireless device is connected.
Meter=String
MeterStyle=StyleSmallText
X=16
Y=22
Text="Looking for devices..."
UpdateDivider=-1

; ------------------------------------------------------------------------
; METERS - Device 1
; ------------------------------------------------------------------------

[DevIcon1]
; Device type icon (headset / mouse / keyboard).
Meter=String
MeterStyle=StyleFluentIcon
X=16
Y=20
FontSize=18
Text=[\xE772]
Group=Device1
Hidden=1
UpdateDivider=-1

[DevName1]
; Device name.
Meter=String
MeterStyle=StyleSmallText | StyleWhiteText
X=54
Y=12
W=220
Group=Device1
Hidden=1
UpdateDivider=-1

[DevPercent1]
; Battery percentage.
Meter=String
MeterStyle=StyleSmallText | StyleWhiteText | StyleRightAlign
X=345
Y=12
Group=Device1
Hidden=1
UpdateDivider=-1

[DevCharging1]
; Charging bolt, left of the percentage.
Meter=String
MeterStyle=StyleFluentIcon
X=([DevPercent1:X]-3)
Y=16
FontSize=11
StringAlign=Right
FontColor=#SuccessColor#
Text=[\xE945]
Group=Device1
Hidden=1
DynamicVariables=1
UpdateDivider=-1

[DevBar1]
; Rounded battery bar (accent color; green when charging, red when low).
Meter=Shape
X=54
Y=40
Shape=Rectangle 0,0,#BarWidth#,4,2 | Fill Color #TrackColor# | StrokeWidth 0
Shape2=Rectangle 0,0,1,4,2 | Fill Color #WindowsColorLight# | StrokeWidth 0
Group=Device1 | WindowsColorGroup
Hidden=1
DynamicVariables=1
UpdateDivider=-1

