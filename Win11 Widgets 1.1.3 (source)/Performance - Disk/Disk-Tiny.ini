[Rainmeter]
Update=1000
; Context menu options to set the background style of all widgets (see backgroundStyles.ini).
ContextTitle3="-"
ContextTitle4=#BgTitleNormal#
ContextAction4=#BgSetNormal#
ContextTitle5=#BgTitleOpaque#
ContextAction5=#BgSetOpaque#
ContextTitle6=#BgTitleClear#
ContextAction6=#BgSetClear#
ContextTitle7=#BgTitleBlur#
ContextAction7=#BgSetBlur#
ContextTitle8=#BgTitleAcrylic#
ContextAction8=#BgSetAcrylic#

[Metadata]
Name=Disk (tiny)
Author=ketamine (based on Win10 Widgets by TJ Markham)
Information=Displays disk information.
License=Creative Commons BY-NC-SA 4.0
Version=1.1.3

[Variables]
@Include1="#@#Performance Templates\performanceTemplateX4.ini"
@Include2="#@#Performance Templates\diskTemplate.ini"
CoreFilePath=""#CURRENTPATH#Disk-Tiny.ini""
BackgroundHeight=62
AutoBorder=1


