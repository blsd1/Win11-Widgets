; Known bug(s):
; - Laptop icon has extra space (a couple pixels) on the right. This space 
;	comes from LaptopDiagonalRight and has to do with the transformation 
;	used to draw the line at a 45 degree angle.

[Rainmeter]
Update=1000
; Context menu option to
ContextTitle="Auto-layout"
ContextAction=[!WriteKeyValue Variables CurrentSetting 0 #CoreFilePath#][!SetVariable CurrentSetting 0][!UpdateMeasure MeasureLayoutSetting][!CommandMeasure MeasureLayoutScript "Load('#ThisAutoLayoutName#', 0)"]
; Context menu option to load layout #1 (usually used for laptop layout).
ContextTitle2="Load Layout 1 (Laptop)"
ContextAction2=[!CommandMeasure MeasureLayoutScript "Load('#Layout1Name#', 1)"]
; Context menu option to load layout #2 (usually used for monitor layout).
ContextTitle3="Load Layout 2 (Monitor)"
ContextAction3=[!CommandMeasure MeasureLayoutScript "Load('#Layout2Name#', 2)"]
; Context menu separator.
ContextTitle4="-"
; Context menu option to set layout #1 (usually used for laptop layout).
ContextTitle5="Set Layout 1 (Laptop)"
ContextAction5=[!Log "set layout 1"][!CommandMeasure MeasureRunSetLayout1 "Run"]
; Context menu option to set layout #2 (usually used for monitor layout).
ContextTitle6="Set Layout 2 (Monitor)"
ContextAction6=[!Log "set layout 2"][!CommandMeasure MeasureRunSetLayout2 "Run"]
; Context menu separator.
ContextTitle7="-"
; Context menu option to make display icon light
ContextTitle8="Light icon"
ContextAction8=[!WriteKeyValue Variables SwitcherHoverColor #SolidWhite# #CoreFilePath#][!WriteKeyValue Variables SwitcherOffColor #TransparentWhite3# #CoreFilePath#][!Refresh]
; Context menu option to make display icon dark
ContextTitle9="Dark icon"
ContextAction9=[!WriteKeyValue Variables SwitcherHoverColor #SolidBlack# #CoreFilePath#][!WriteKeyValue Variables SwitcherOffColor #TransparentBlack2# #CoreFilePath#][!Refresh]
; Context menu separator.
ContextTitle10="-"
; Context menu option to bring up help dialog.
ContextTitle11="Help"
ContextAction11=["#CURRENTPATH#LayoutSwitcher-Help.txt"]
; Context menu options to set the background style of all widgets (see backgroundStyles.ini).
ContextTitle12="-"
ContextTitle13=#BgTitleNormal#
ContextAction13=#BgSetNormal#
ContextTitle14=#BgTitleOpaque#
ContextAction14=#BgSetOpaque#
ContextTitle15=#BgTitleClear#
ContextAction15=#BgSetClear#
ContextTitle16=#BgTitleBlur#
ContextAction16=#BgSetBlur#
ContextTitle17=#BgTitleAcrylic#
ContextAction17=#BgSetAcrylic#

[Metadata]
Name=LayoutSwitcher (small)
Author=ketamine (based on Win10 Widgets by TJ Markham)
Information=Switches/sets rainmeter layouts.
License=Creative Commons BY-NC-SA 4.0
Version=1.1.3

[Variables]
@Include1=#@#variables.ini
@Include2=#@#styles.ini
CoreFilePath=""#CURRENTPATH#LayoutSwitcher-Small.ini""
SwitcherWidth=30
SwitcherHeight=21
SwitcherIconSize=22
SwitcherIconY=0
Layout1Name="LayoutSwitcher1"
Layout2Name="LayoutSwitcher2"
CurrentLayoutName=
NextLayoutName=
ThisAutoLayoutName=
NextAutoLayoutName=
CurrentSetting=0
NextSetting=1
SwitcherHoverColor=255,255,255,255
SwitcherOffColor=255,255,255,35
MonitorY=-1
LaptopY=-2
; Monitor count last acted on (-1 until the first reading).
SettledMonitors=-1
; Updates (seconds) a new monitor count must hold before acting on it, so brief changes
; (e.g. a DisplayPort monitor going to sleep) don't refresh/reload anything.
MonitorSettleUpdates=4


; ------------------------------------------------------------------------
; MEASURES
; ------------------------------------------------------------------------

[MeasureLayoutScript]
; Loads layouts; explains how to save a layout that hasn't been saved yet.
Measure=Script
ScriptFile=#CURRENTPATH#layouts.lua
UpdateDivider=-1

[MeasureLayout1NotSet]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
; Message box (mshta popups no longer work on current Windows).
Parameter=-NoProfile -WindowStyle Hidden -Command "Add-Type -AssemblyName PresentationFramework; [void][System.Windows.MessageBox]::Show('Layout 1 (Laptop) has not been saved yet. Arrange your widgets, then right-click this icon and choose Set Layout 1 (Laptop).', 'Win11 Widgets - LayoutSwitcher', 'OK', 'Warning')"
State=Hide
UpdateDivider=-1

[MeasureLayout2NotSet]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
; Message box (mshta popups no longer work on current Windows).
Parameter=-NoProfile -WindowStyle Hidden -Command "Add-Type -AssemblyName PresentationFramework; [void][System.Windows.MessageBox]::Show('Layout 2 (Monitor) has not been saved yet. Arrange your widgets, then right-click this icon and choose Set Layout 2 (Monitor).', 'Win11 Widgets - LayoutSwitcher', 'OK', 'Warning')"
State=Hide
UpdateDivider=-1
[MeasureRunSetLayout1]
; Executes command to save Layout 1.
Measure=Plugin
Plugin=RunCommand
Program=cmd.exe
; Saves the current layout and confirms with a message box (creates the layout folder first; the old xcopy
; hung asking "file or directory?").
Parameter=/c (if not exist "#SETTINGSPATH#Layouts\#Layout1Name#" mkdir "#SETTINGSPATH#Layouts\#Layout1Name#") & copy /y "#SETTINGSPATH#Rainmeter.ini" "#SETTINGSPATH#Layouts\#Layout1Name#\Rainmeter.ini" >nul && powershell -NoProfile -WindowStyle Hidden -Command "Add-Type -AssemblyName PresentationFramework; [void][System.Windows.MessageBox]::Show('Layout 1 (Laptop) saved.', 'Win11 Widgets - LayoutSwitcher', 'OK', 'Information')"
State=Hide
DynamicVariables=1
UpdateDivider=-1

[MeasureRunSetLayout2]
; Executes command to save Layout 2.
Measure=Plugin
Plugin=RunCommand
Program=cmd.exe
; Saves the current layout and confirms with a message box (creates the layout folder first; the old xcopy
; hung asking "file or directory?").
Parameter=/c (if not exist "#SETTINGSPATH#Layouts\#Layout2Name#" mkdir "#SETTINGSPATH#Layouts\#Layout2Name#") & copy /y "#SETTINGSPATH#Rainmeter.ini" "#SETTINGSPATH#Layouts\#Layout2Name#\Rainmeter.ini" >nul && powershell -NoProfile -WindowStyle Hidden -Command "Add-Type -AssemblyName PresentationFramework; [void][System.Windows.MessageBox]::Show('Layout 2 (Monitor) saved.', 'Win11 Widgets - LayoutSwitcher', 'OK', 'Information')"
State=Hide
DynamicVariables=1
UpdateDivider=-1

[MeasureNumMonitors]
; Returns number of monitors
Measure=Plugin
Plugin=SysInfo
SysInfoType=NUM_MONITORS
IfCondition=(MeasureNumMonitors>1)
IfTrueAction=[!SetVariable ThisAutoLayoutName #Layout2Name#][!SetVariable NextAutoLayoutName #Layout2Name#][!ShowMeterGroup MonitorIcon][!HideMeterGroup LaptopIcon][!SetOption CurrentSettingMeter Y #MonitorY#]
IfFalseAction=[!SetVariable ThisAutoLayoutName #Layout1Name#][!SetVariable NextAutoLayoutName #Layout1Name#][!HideMeterGroup MonitorIcon][!ShowMeterGroup LaptopIcon][!SetOption CurrentSettingMeter Y #LaptopY#]
DynamicVariables=1
UpdateDivider=2

[MeasureNumMonitorsSettle]
; Debounce for MeasureNumMonitors: counts consecutive updates in which the monitor count differs
; from #SettledMonitors#; refreshes Rainmeter only once the new count has held for #MonitorSettleUpdates#.
Measure=Calc
Formula=((#SettledMonitors#<0) || (MeasureNumMonitors=#SettledMonitors#)) ? 0 : (MeasureNumMonitorsSettle+1)
IfCondition=(#SettledMonitors#<0)
IfTrueAction=[!SetVariable SettledMonitors [MeasureNumMonitors]]
IfCondition2=(MeasureNumMonitorsSettle>=#MonitorSettleUpdates#)
IfTrueAction2=[!SetVariable SettledMonitors [MeasureNumMonitors]][!RefreshApp]
DynamicVariables=1

[MeasureLayoutSetting]
; Changes data flow depending on what layout setting is selected.
Measure=Calc
; 0: Auto-layout, 1: Layout #1, 2: Layout #2
IfCondition=(#CurrentSetting#=0)
IfTrueAction=[!SetOption CurrentSettingMeter Text "A"][!SetVariable NextSetting "1"][!SetVariable NextLayoutName #Layout1Name#][!EnableMeasure MeasureNumMonitorsAuto][!EnableMeasure MeasureNumMonitorsAutoSettle][!DisableMeasure MeasureNumMonitors][!DisableMeasure MeasureNumMonitorsSettle]
IfCondition2=(#CurrentSetting#=1)
IfTrueAction2=[!SetVariable CurrentLayoutName #Layout1Name#][!SetVariable NextSetting "2"][!SetVariable NextLayoutName #Layout2Name#][!DisableMeasure MeasureNumMonitorsAuto][!DisableMeasure MeasureNumMonitorsAutoSettle][!EnableMeasure MeasureNumMonitors][!EnableMeasure MeasureNumMonitorsSettle]
IfCondition3=(#CurrentSetting#=2)
IfTrueAction3=[!SetVariable CurrentLayoutName #Layout2Name#][!SetVariable NextSetting "0"][!SetVariable NextLayoutName #NextAutoLayoutName#][!DisableMeasure MeasureNumMonitorsAuto][!DisableMeasure MeasureNumMonitorsAutoSettle][!EnableMeasure MeasureNumMonitors][!EnableMeasure MeasureNumMonitorsSettle]
IfConditionMode=1
DynamicVariables=1
UpdateDivider=-1

[MeasureNumMonitorsAuto]
; Returns number of monitors
Measure=Plugin
Plugin=SysInfo
SysInfoType=NUM_MONITORS
IfCondition=(MeasureNumMonitorsAuto>1)
IfTrueAction=[!SetVariable CurrentLayoutName #Layout2Name#][!SetVariable ThisAutoLayoutName #Layout2Name#][!ShowMeterGroup MonitorIcon][!HideMeterGroup LaptopIcon][!SetOption CurrentSettingMeter Y #MonitorY#]
IfFalseAction=[!SetVariable CurrentLayoutName #Layout1Name#][!SetVariable ThisAutoLayoutName #Layout1Name#][!HideMeterGroup MonitorIcon][!ShowMeterGroup LaptopIcon][!SetOption CurrentSettingMeter Y #LaptopY#]
DynamicVariables=1
UpdateDivider=2

[MeasureNumMonitorsAutoSettle]
; Debounce for auto-layout: counts consecutive updates in which the screen category (one vs. more than one)
; differs from #SettledMonitors#; once the new category has held for #MonitorSettleUpdates#, loads the
; layout for the current count (>1: Layout 2, else Layout 1). 2 <-> 3 monitors loads nothing.
Measure=Calc
Formula=((#SettledMonitors#<0) || ((MeasureNumMonitorsAuto>1)=(#SettledMonitors#>1))) ? 0 : (MeasureNumMonitorsAutoSettle+1)
IfCondition=(#SettledMonitors#<0)
IfTrueAction=[!SetVariable SettledMonitors [MeasureNumMonitorsAuto]]
IfCondition2=(MeasureNumMonitorsAutoSettle>=#MonitorSettleUpdates#) && (MeasureNumMonitorsAuto>1)
IfTrueAction2=[!SetVariable SettledMonitors [MeasureNumMonitorsAuto]][!CommandMeasure MeasureLayoutScript "Load('#Layout2Name#', nil, true)"]
IfCondition3=(MeasureNumMonitorsAutoSettle>=#MonitorSettleUpdates#) && (MeasureNumMonitorsAuto<=1)
IfTrueAction3=[!SetVariable SettledMonitors [MeasureNumMonitorsAuto]][!CommandMeasure MeasureLayoutScript "Load('#Layout1Name#', nil, true)"]
DynamicVariables=1


; ------------------------------------------------------------------------
; METERS
; ------------------------------------------------------------------------

[SwitcherButton]
; Controls icon color based on mouse position.
; When clicked, the current layout changes to the next layout in the rotation 
; (automatic -> layout 1 -> layout 2 -> automatic -> etc.).
Meter=Image
X=0
Y=0
W=#SwitcherWidth#
H=#SwitcherHeight#
SolidColor=#Transparent#
LeftMouseUpAction=[!CommandMeasure MeasureLayoutScript "Load('#NextLayoutName#', #NextSetting#)"]
MouseOverAction=[!SetOption CurrentSettingMeter FontColor #SwitcherHoverColor#][!UpdateMeter CurrentSettingMeter][!SetOptionGroup Icon FontColor #SwitcherHoverColor#][!UpdateMeterGroup Icon]
MouseLeaveAction=[!SetOption CurrentSettingMeter FontColor #SwitcherOffColor#][!UpdateMeter CurrentSettingMeter][!SetOptionGroup Icon FontColor #SwitcherOffColor#][!UpdateMeterGroup Icon]
MouseActionCursor=0
DynamicVariables=1
UpdateDivider=-1

[CurrentSettingMeter]
; Shows current layout setting
; (A - Automatic, 1 - Layout 1, 2 - Layout 2).
Meter=String
MeterStyle=StyleMediumText | StyleCenterAlign
X=(#SwitcherWidth#/2)
Y=-2
W=18
H=17
Text=#CurrentSetting#
FontSize=10
FontFace=Segoe UI Variable Text
FontWeight=600
FontColor=#SwitcherOffColor#
DyanmicVariables=1
UpdateDivider=-1


; ------------------------------------------------------------------------
; METERS - Laptop/Monitor Icons
; ------------------------------------------------------------------------

[LaptopIconMeter]
; Shows the "laptop" layout icon (Windows 11 style, Segoe Fluent Icons).
Meter=String
MeterStyle=StyleFluentIcon | StyleCenterAlign
X=(#SwitcherWidth#/2)
Y=#SwitcherIconY#
FontSize=#SwitcherIconSize#
FontColor=#SwitcherOffColor#
Group=LaptopIcon | Icon
Text=[\xE7F8]
UpdateDivider=-1

[MonitorIconMeter]
; Shows the "monitor" layout icon (Windows 11 style, Segoe Fluent Icons).
Meter=String
MeterStyle=StyleFluentIcon | StyleCenterAlign
X=(#SwitcherWidth#/2)
Y=#SwitcherIconY#
FontSize=#SwitcherIconSize#
FontColor=#SwitcherOffColor#
Group=MonitorIcon | Icon
Text=[\xE7F4]
UpdateDivider=-1
