; Known bug(s):
; - None

[Rainmeter]
Update=1000
MouseActionCursor=0

[Metadata]
Name=Welcome
Author=ketamine (based on Win10 Widgets by TJ Markham)
Information=Displays welcome information.
License=Creative Commons BY-NC-SA 4.0
Version=1.1.3

[Variables]
@Include1=#@#systemColors.ini
@Include2=#@#variables.ini
@Include3=#@#styles.ini
@Include4=#@#background.ini
CoreFilePath=""#CURRENTPATH#Welcome.ini""
BackgroundWidth=800
BackgroundHeight=440
AutoBorder=0
PayPalUrl=https://www.paypal.com/paypalme/isuserformula
; Right column (text and buttons) position and width.
ColumnX=512
ColumnW=264
; Windows 11 (dark mode) button states, changed on hover/press.
CloseFill=#Transparent#
CloseGlyph=#SolidWhite#
IntroFill=255,255,255,15
PayPalAlpha=FF
PayPalText=#SolidBlack#


; ------------------------------------------------------------------------
; MEASURES
; ------------------------------------------------------------------------

[MeasureAccent]
; Returns the light accent colour as a bare RRGGBB (the registry output ends with a line break).
Measure=String
String=[MeasureWindowsColorLight]
RegExpSubstitute=1
Substitute="(?s)^\s*([[:xdigit:]]{6}).*":"\1","^$":"FFFFFF"
DynamicVariables=1

[MeasureAccentLumaFormula]
; Turns the accent colour into a brightness formula.
Measure=String
String=[MeasureAccent]
RegExpSubstitute=1
Substitute="^(..)(..)(..)$":"(0x\1*0.299+0x\2*0.587+0x\3*0.114)"
DynamicVariables=1

[MeasureAccentLuma]
; Uses black text on bright accent colours and white text on dark ones (as Windows 11 does).
Measure=Calc
Formula=[MeasureAccentLumaFormula]
IfCondition=MeasureAccentLuma >= 140
IfTrueAction=[!SetVariable PayPalText #SolidBlack#][!UpdateMeter PayPalButtonText][!Redraw]
IfFalseAction=[!SetVariable PayPalText #SolidWhite#][!UpdateMeter PayPalButtonText][!Redraw]
DynamicVariables=1


; ------------------------------------------------------------------------
; STYLES
; ------------------------------------------------------------------------

[StyleHeading]
AntiAlias=1
FontFace=Segoe UI Variable Text
FontWeight=600
FontSize=13
FontColor=#SolidWhite#
StringAlign=Left

[StyleBody]
W=#ColumnW#
AntiAlias=1
FontFace=Segoe UI Variable Text
FontSize=10
FontColor=#SolidGreyText#
StringAlign=Left
ClipString=2

[StyleButtonText]
AntiAlias=1
FontFace=Segoe UI Variable Text
FontSize=10
StringAlign=CenterCenter
UpdateDivider=-1
DynamicVariables=1


; ------------------------------------------------------------------------
; METERS - Title bar
; ------------------------------------------------------------------------

[TopBarText]
; Shows title bar text.
Meter=String
MeterStyle=StyleTinyText
X=16
Y=9
Text="Welcome"
UpdateDivider=-1

[TopBarCloseButton]
; Shows Windows 11 close button (only the top-right corner is rounded, to follow the card).
Meter=Shape
X=(#BackgroundWidth#-47)
Y=1
Shape=Rectangle 0,0,46,31,7 | Fill Color #CloseFill# | StrokeWidth 0
Shape2=Rectangle 0,0,23,31
Shape3=Rectangle 0,8,46,23
Shape4=Combine Shape | Union Shape2 | Union Shape3
MouseOverAction=[!SetVariable CloseFill 196,43,28][!UpdateMeterGroup CloseGroup][!Redraw]
MouseLeaveAction=[!SetVariable CloseFill #Transparent#][!SetVariable CloseGlyph #SolidWhite#][!UpdateMeterGroup CloseGroup][!Redraw]
LeftMouseDownAction=[!SetVariable CloseFill 196,43,28,230][!SetVariable CloseGlyph 255,255,255,200][!UpdateMeterGroup CloseGroup][!Redraw]
LeftMouseUpAction=[!DeactivateConfig]
Group=CloseGroup
UpdateDivider=-1
DynamicVariables=1

[TopBarCloseGlyph]
; Shows close "x" (Segoe Fluent Icons ChromeClose).
Meter=String
MeterStyle=StyleFluentIcon
X=(#BackgroundWidth#-24)
Y=17
FontSize=8
FontColor=#CloseGlyph#
StringAlign=CenterCenter
Text=[\xE8BB]
Group=CloseGroup
UpdateDivider=-1
DynamicVariables=1


; ------------------------------------------------------------------------
; METERS - Header
; ------------------------------------------------------------------------

[WelcomeTitle]
; Shows welcome title.
Meter=String
X=22
Y=40
AntiAlias=1
FontFace=Segoe UI Variable Display
FontWeight=600
FontSize=24
FontColor=#SolidWhite#
Text="Welcome to Win11 Widgets"
UpdateDivider=-1

[WelcomeSubtitle]
; Shows welcome subtitle.
Meter=String
MeterStyle=StyleBody
X=24
Y=2R
W=(#BackgroundWidth#-48)
FontSize=11
Text="Windows 11 styled desktop widgets that follow your accent colour."
UpdateDivider=-1


; ------------------------------------------------------------------------
; METERS - Screenshot
; ------------------------------------------------------------------------

[ScreenshotMask]
; Rounds the corners of the screenshot.
Meter=Shape
X=24
Y=108
Shape=Rectangle 0,0,464,256,6 | Fill Color 255,255,255 | StrokeWidth 0
UpdateDivider=-1

[Screenshot]
; Shows desktop screenshot; opens the full-size image when clicked.
Meter=Image
X=0
Y=0
W=464
H=256
ImageName="icons\screenshot.png"
Container=ScreenshotMask
ToolTipText="View full-size screenshot"
LeftMouseUpAction=["#ROOTCONFIGPATH#Windows-11-Widgets.jpg"]
MouseActionCursor=1
UpdateDivider=-1

[ScreenshotBorder]
; Shows subtle 1px border around the screenshot.
Meter=Shape
X=24
Y=108
Shape=Rectangle 0.5,0.5,463,255,6 | Fill Color 0,0,0,0 | StrokeWidth 1 | Stroke Color #BorderColor#
UpdateDivider=-1


; ------------------------------------------------------------------------
; METERS - Get started
; ------------------------------------------------------------------------

[GetStartedHeading]
; Shows "Get started" heading.
Meter=String
MeterStyle=StyleHeading
X=#ColumnX#
Y=104
Text="Get started"
UpdateDivider=-1

[GetStartedText]
; Shows short usage instructions.
Meter=String
MeterStyle=StyleBody
X=#ColumnX#
Y=4R
Text="Right-click the Rainmeter tray icon and open Skins > Win11 Widgets to add widgets. Right-click a widget > Variants to resize it."
UpdateDivider=-1

[IntroButton]
; Shows Windows 11 standard button; opens the intro text file.
Meter=Shape
X=#ColumnX#
Y=12R
Shape=Rectangle 0.5,0.5,(#ColumnW#-1),31,4 | Fill Color #IntroFill# | StrokeWidth 1 | Stroke Color #BorderColor#
MouseOverAction=[!SetVariable IntroFill 255,255,255,21][!UpdateMeterGroup IntroGroup][!Redraw]
MouseLeaveAction=[!SetVariable IntroFill 255,255,255,15][!UpdateMeterGroup IntroGroup][!Redraw]
LeftMouseDownAction=[!SetVariable IntroFill 255,255,255,8][!UpdateMeterGroup IntroGroup][!Redraw]
LeftMouseUpAction=[!SetVariable IntroFill 255,255,255,21][!UpdateMeterGroup IntroGroup][!Redraw]["#CURRENTPATH#Welcome-Intro.txt"]
Group=IntroGroup
UpdateDivider=-1
DynamicVariables=1

[IntroButtonText]
; Shows text on intro button.
Meter=String
MeterStyle=StyleButtonText
X=([IntroButton:X]+#ColumnW#/2)
Y=([IntroButton:Y]+16)
FontColor=#SolidWhite#
Text="Read the intro guide"


; ------------------------------------------------------------------------
; METERS - Support
; ------------------------------------------------------------------------

[SupportHeading]
; Shows "Support" heading.
Meter=String
MeterStyle=StyleHeading
X=#ColumnX#
Y=([IntroButton:Y]+52)
Text="Support the project"
UpdateDivider=-1
DynamicVariables=1

[SupportText]
; Shows donation text.
Meter=String
MeterStyle=StyleBody
X=#ColumnX#
Y=4R
Text="If you enjoy your new desktop, a small donation keeps new widgets coming."
UpdateDivider=-1

[PayPalButton]
; Shows Windows 11 accent button; opens PayPal donation page.
Meter=Shape
X=#ColumnX#
Y=12R
Shape=Rectangle 0,0,#ColumnW#,32,4 | Fill Color [MeasureAccent]#PayPalAlpha# | StrokeWidth 0
MouseOverAction=[!SetVariable PayPalAlpha E6][!UpdateMeter PayPalButton][!Redraw]
MouseLeaveAction=[!SetVariable PayPalAlpha FF][!UpdateMeter PayPalButton][!Redraw]
LeftMouseDownAction=[!SetVariable PayPalAlpha CC][!UpdateMeter PayPalButton][!Redraw]
LeftMouseUpAction=[!SetVariable PayPalAlpha E6][!UpdateMeter PayPalButton][!Redraw]["#PayPalUrl#"]
DynamicVariables=1

[PayPalButtonText]
; Shows text on PayPal button.
Meter=String
MeterStyle=StyleButtonText
X=([PayPalButton:X]+#ColumnW#/2)
Y=([PayPalButton:Y]+16)
FontColor=#PayPalText#
FontWeight=600
Text="Donate with PayPal"


; ------------------------------------------------------------------------
; METERS - Footer
; ------------------------------------------------------------------------

[FooterDivider]
; Shows line above footer.
Meter=Image
X=1
Y=(#BackgroundHeight#-40)
W=(#BackgroundWidth#-2)
H=1
SolidColor=#BorderColor#
UpdateDivider=-1

[FooterVersion]
; Shows version.
Meter=String
MeterStyle=StyleTinyText
X=24
Y=(#BackgroundHeight#-28)
Text="Made by ketamine  [\x00B7]  Version #Version#"
UpdateDivider=-1

[FooterCredit]
; Shows credit and license.
Meter=String
MeterStyle=StyleTinyText | StyleRightAlign
X=(#BackgroundWidth#-24)
Y=(#BackgroundHeight#-28)
Text="Based on Win10 Widgets by TJ Markham  [\x00B7]  CC BY-NC-SA 4.0"
UpdateDivider=-1
