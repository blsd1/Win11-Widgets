; Known bug(s):
; - None

[Rainmeter]
Update=1000
; Context menu option to make lock icon light
ContextTitle="Light icon"
ContextAction=[!WriteKeyValue Variables LockIconHoverColor #SolidWhite# #CoreFilePath#][!WriteKeyValue Variables LockIconOffColor #TransparentWhite3# #CoreFilePath#][!Refresh]
; Context menu option to make lock icon dark
ContextTitle2="Dark icon"
ContextAction2=[!WriteKeyValue Variables LockIconHoverColor #SolidBlack# #CoreFilePath#][!WriteKeyValue Variables LockIconOffColor #TransparentBlack2# #CoreFilePath#][!Refresh]
; Context menu separator.
ContextTitle3="-"
; Context menu option to bring up help dialog.
ContextTitle4="Help"
ContextAction4=["#CURRENTPATH#Lock-Help.txt"]
; Context menu options to set the background style of all widgets (see backgroundStyles.ini).
ContextTitle5="-"
ContextTitle6=#BgTitleNormal#
ContextAction6=#BgSetNormal#
ContextTitle7=#BgTitleOpaque#
ContextAction7=#BgSetOpaque#
ContextTitle8=#BgTitleClear#
ContextAction8=#BgSetClear#
ContextTitle9=#BgTitleBlur#
ContextAction9=#BgSetBlur#
ContextTitle10=#BgTitleAcrylic#
ContextAction10=#BgSetAcrylic#

[Metadata]
Name=Lock (small)
Author=ketamine (based on Win10 Widgets by TJ Markham)
Information=Locks/unlocks meters.
;("locked" means dragging is disabled for all skins; "unlocked" means each skin falls back to its specific "drag-able" setting).
License=Creative Commons BY-NC-SA 4.0
Version=1.1.3

[Variables]
@Include=#@#variables.ini
CoreFilePath=""#CURRENTPATH#Lock-Small.ini""
DisableDragging=0
NewDisableDragging=0
LockIconHoverColor=255,255,255,255
LockIconOffColor=255,255,255,35
LockIconSize=12


; ------------------------------------------------------------------------
; MEASURES
; ------------------------------------------------------------------------

[MeasureDisableDragging]
Measure=Plugin
Plugin=WebParser.dll
URL=file://#SETTINGSPATH#Rainmeter.ini
RegExp=DisableDragging=(.*)
RegExpSubstitute=1
Substitute="DisableDragging=(\d)":"\1"
;OnUpdateAction=[!Log "Checking settings file for DisableDragging..."]
;FinishAction=[!Log "Found DisableDragging."]
;OnConnectErrorAction=[!Log "Couldn't find settings file."]
;OnRegExpErrorAction=[!Log "Couldn't find DisableDragging."]
FinishAction=[!SetVariable DisableDragging [MeasureDisableDragging]][!UpdateMeasure MeasureLockIcon]
OnRegExpErrorAction=[!SetVariable DisableDragging 0][!UpdateMeasure MeasureLockIcon]
DynamicVariables=1
;UpdateDivider=10
UpdateDivider=-1
UpdateRate=1

[MeasureLockIcon]
Measure=String
String=#DisableDragging#
IfMatch=0
IfNotMatchAction=[!SetOption LockIcon Text "[\xE72E]"][!SetVariable NewDisableDragging 0][!UpdateMeter LockIcon][!Redraw]
IfMatchAction=[!SetOption LockIcon Text "[\xE785]"][!SetVariable NewDisableDragging 1][!UpdateMeter LockIcon][!Redraw]
DynamicVariables=1
UpdateDivider=-1


; ------------------------------------------------------------------------
; METERS
; ------------------------------------------------------------------------

[LockIcon]
; Shows the lock icon (Windows 11 style, Segoe Fluent Icons): closed = dragging disabled, open = dragging enabled.
; Toggles dragging for all skins when clicked.
Meter=String
X=0
Y=0
FontFace=Segoe Fluent Icons
FontSize=#LockIconSize#
FontColor=#LockIconOffColor#
; Nearly transparent background so the whole icon area (not just the glyph's lines) is clickable.
SolidColor=0,0,0,1
AntiAlias=1
Text=[\xE72E]
LeftMouseUpAction=[!WriteKeyValue Rainmeter DisableDragging #NewDisableDragging# "#SETTINGSPATH#Rainmeter.ini"][!RefreshApp]
MouseOverAction=[!SetOption LockIcon FontColor #LockIconHoverColor#][!UpdateMeter LockIcon][!Redraw]
MouseLeaveAction=[!SetOption LockIcon FontColor #LockIconOffColor#][!UpdateMeter LockIcon][!Redraw]
MouseActionCursor=0
DynamicVariables=1
UpdateDivider=-1
