[Metadata]
Name=LayoutSwitcher (medium)
Author=ketamine (based on Win10 Widgets by TJ Markham)
Information=Switches/sets rainmeter layouts.
License=Creative Commons BY-NC-SA 4.0
Version=1.1.0

[Variables]
@Include=LayoutSwitcher-Small.ini
SwitcherWidth=45
SwitcherHeight=32
SwitcherIconSize=34
SwitcherIconY=0
MonitorY=-3
LaptopY=-4


