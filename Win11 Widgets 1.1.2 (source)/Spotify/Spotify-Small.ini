; Spotify Plug-in Credit: .raptor

; Known bug(s):
; - Sometimes the Spotify plug-in doesn't seem to work. Restarting the 
;	computer and/or Spotify seems to help, but doesn't always work. From 
;	what I can tell this is a side-effect of the Spotify plug-in.
; - Current song position shows :59, then :60 briefly, then 1:00. It 
;	should show :59 and then going straight to 1:00. From what I can 
;	tell this is a side-effect of the Spotify plug-in.
; - Current song position isn't 100% in sync; it's off by ~+0.5 second. 
;	From what I can tell this is a side-effect of the Spotify plug-in.
; - When the artist field has a comma in it, only the text before the 
;	comma is shown. From what I can tell this is a side-effect of the 
;	Spotify plug-in.
; - Long song titles and artist names get cut off with "..." instead of 
;	scrolling when moused over. The current method for performing this 
;	action (letter by letter) is too choppy and therefore was not 
;	implemented.
; - The progress bar sometimes doesn't refresh when Spotify is first 
;	opened, however the bar will return to its normal behavior once the 
;	next song starts or the skin is refreshed. This bug is difficult to 
;	re-produce, and thus difficult to fix. At the time of release, not 
;	sure what the cause is or how it can be fixed.

[Rainmeter]
Update=500
MouseActionCursor=0
; Context menu option to show remaining time/length.
ContextTitle="Show remaining time/length"
ContextAction=[!WriteKeyValue MeterTime Group SpotifyOn #CoreFilePath#][!WriteKeyValue MeterTimeOff Group SpotifyOff #CoreFilePath#][!WriteKeyValue MeasurePosition Disabled 0 #CoreFilePath#][!WriteKeyValue MeasureLength Disabled 0 #CoreFilePath#][!Refresh]
; Context menu option to hide remaining time/length.
ContextTitle2="Hide remaining time/length"
ContextAction2=[!WriteKeyValue MeterTime Hidden 1 #CoreFilePath#][!WriteKeyValue MeterTimeOff Hidden 1 #CoreFilePath#][!WriteKeyValue MeterTime Group "" #CoreFilePath#][!WriteKeyValue MeterTimeOff Group "" #CoreFilePath#][!WriteKeyValue MeasurePosition Disabled 1 #CoreFilePath#][!WriteKeyValue MeasureLength Disabled 1 #CoreFilePath#][!Refresh]

[Metadata]
Name=Spotify (small)
Author=ketamine (based on Win10 Widgets by TJ Markham)
Information=Displays Spotify info and controls.
License=Creative Commons BY-NC-SA 4.0
Version=1.1.2

[Variables]
; Player shown by this widget (part of its Windows app id). "any" = whatever player Windows shows as current.
MediaApp=Spotify
; Must match Update in [Rainmeter] (used for the helper heartbeat).
UpdateMs=500
@Include1=#@#variables.ini
@Include2=#@#styles.ini
@Include3=#@#background.ini
CoreFilePath=""#CURRENTPATH#Spotify-Small.ini""
BackgroundHeight=58
BarColor=#SpotifyGreen#
HovorColor=#SolidWhite#
HovorColor2=#SpotifyGreen#
ClickColor=#SolidGreyPause#
LeftPadding=60
MediaIconSize=11
PlayIconSize=11
; Media icon centers (relative to LeftPadding / bottom of widget; match the button hit areas below).
PrevIconX=10.5
PlayIconX=46
NextIconX=81.5
MediaIconY=31
AutoBorder=1


; ------------------------------------------------------------------------
; MEASURES
; ------------------------------------------------------------------------

[MeasureMediaStart]
; Starts the media helper once when the skin loads.
Measure=Calc
Formula=1
OnUpdateAction=[!CommandMeasure MeasureMediaHelper Run]
UpdateDivider=-1

[MeasureMediaHelper]
; Starts the small background program (MediaHelper.cs, compiled on first use by mediaHelper.ps1) that reads
; what Spotify is playing from Windows (the same info the Windows 11 media flyout shows).
; It exits by itself when this widget is unloaded.
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "#CURRENTPATH#mediaHelper.ps1" -App "#MediaApp#"
State=Hide
Timeout=60000
UpdateDivider=-1

[MeasureMediaScript]
; Reads the helper's output and fills in the measures below; the buttons send commands through it.
Measure=Script
ScriptFile=#CURRENTPATH#media.lua

[MeasurePlayer]
; 1 when Spotify is running (set by media.lua). Shows/hides corresponding meters.
Measure=Calc
Formula=0
IfCondition=(MeasurePlayer=1)
IfTrueAction=[!EnableMeasureGroup SpotifyMeasures][!ShowMeterGroup SpotifyOn][!HideMeterGroup SpotifyOff][!UpdateMeter MeterCover]
IfFalseAction=[!DisableMeasureGroup SpotifyMeasures][!ShowMeterGroup SpotifyOff][!HideMeterGroup SpotifyOn][!HideMeterGroup Pause][!ShowMeterGroup Play]
UpdateDivider=-1

[MeasureCover]
; Cover image of the current track (set by media.lua).
Measure=String
Group=SpotifyMeasures
OnChangeAction=[!UpdateMeter MeterCover]
UpdateDivider=-1

[MeasurePlaying]
; 1 while playing, 0 while paused (set by media.lua).
Measure=Calc
Formula=0
Group=SpotifyMeasures
IfCondition=(MeasurePlaying=1)
IfTrueAction=[!SetVariable HovorColor #SolidWhite#][!SetVariable HovorColor2 #SpotifyGreen#][!SetVariable ClickColor #SolidGreyPause#][!ShowMeterGroup Pause][!HideMeterGroup Play]
IfFalseAction=[!SetVariable HovorColor #SpotifyGreen#][!SetVariable HovorColor2 #SolidWhite#][!SetVariable ClickColor #SpotifyGreen#][!HideMeterGroup Pause][!ShowMeterGroup Play]
OnChangeAction=[!UpdateMeter PlayPauseCircle]
UpdateDivider=-1

[MeasurePosition]
; Position of the current track, e.g. 1:07 (set by media.lua).
Measure=String
Group=SpotifyMeasures
OnChangeAction=[!UpdateMeter MeterTime][!UpdateMeter MeterArtist]
UpdateDivider=-1
Disabled=0

[MeasureLength]
; Length of the current track (set by media.lua).
Measure=String
Group=SpotifyMeasures
OnChangeAction=[!UpdateMeter MeterTime]
UpdateDivider=-1
Disabled=0

[MeasureProgress]
; Progress of the current track, 0-100 (set by media.lua).
Measure=Calc
Formula=0
MinValue=0
MaxValue=100
Group=SpotifyMeasures
OnChangeAction=[!UpdateMeter MeterBar]
UpdateDivider=-1

[MeasureTrack]
; Name of the current track (set by media.lua).
Measure=String
Group=SpotifyMeasures
OnChangeAction=[!UpdateMeter MeterTrack]
UpdateDivider=-1

[MeasureArtist]
; Artist of the current track (set by media.lua).
Measure=String
Group=SpotifyMeasures
OnChangeAction=[!UpdateMeter MeterArtist]
UpdateDivider=-1

; ------------------------------------------------------------------------
; METERS - Previous Track
; ------------------------------------------------------------------------

[PreviousButton]
; Goes to previous Spotify track when clicked.
Meter=Image
X=#LeftPadding#
Y=(#BackgroundHeight#-42)
W=21
H=22
SolidColor=#Transparent#
Group=SpotifyOn
LeftMouseUpAction=[!CommandMeasure MeasureMediaScript "Send('previous')"]
UpdateDivider=-1

[PreviousIcon]
; Shows the "previous track" icon (Windows 11 style, Segoe Fluent Icons).
Meter=String
MeterStyle=StyleFluentIcon
X=(#LeftPadding#+#PrevIconX#)
Y=(#BackgroundHeight#-#MediaIconY#)
FontSize=#MediaIconSize#
StringAlign=CenterCenter
Text=[\xF8AC]
UpdateDivider=-1


; ------------------------------------------------------------------------
; METERS - Play/Pause Circle
; ------------------------------------------------------------------------

[PlayPauseCircle]
; Shows the circle of the play/pause button when Spotify is open.
; Acts as play/pause button; plays/pauses current Spotify track when clicked.
Meter=Roundline
X=([PreviousButton:X]+30)
Y=([PreviousButton:Y]-5)
H=32
W=32
AntiAlias=1
Group=SpotifyOn
RotationAngle=(Rad(360))
LineStart=16
LineLength=14.8
LineColor=#SolidGreyText#
Solid=1
LeftMouseDownAction=[!SetOption PlayPauseCircle LineColor #ClickColor#][!UpdateMeter PlayPauseCircle]
LeftMouseUpAction=[!CommandMeasure MeasureMediaScript "Send('playpause')"][!SetOption PlayPauseCircle LineColor #HovorColor2#][!UpdateMeter PlayPauseCircle]
MouseOverAction=[!SetOption PlayPauseCircle LineColor #HovorColor#][!UpdateMeter PlayPauseCircle]
MouseLeaveAction=[!SetOption PlayPauseCircle LineColor #SolidGreyText#][!UpdateMeter PlayPauseCircle]
DynamicVariables=1
UpdateDivider=-1

[PlayPauseCircleOff]
; Shows the circle of the play/pause button when Spotify is closed.
Meter=Roundline
X=[PlayPauseCircle:X]
Y=[PlayPauseCircle:Y]
H=[PlayPauseCircle:H]
W=[PlayPauseCircle:W]
AntiAlias=1
Group=SpotifyOff
RotationAngle=(Rad(360))
LineStart=16
LineLength=14.8
LineColor=#SolidGreyText#
Solid=1
UpdateDivider=-1


; ------------------------------------------------------------------------
; METERS - Play/Pause Icons
; ------------------------------------------------------------------------

[PlayIcon]
; Shows the "play" icon (Windows 11 style, Segoe Fluent Icons).
Meter=String
MeterStyle=StyleFluentIcon
X=(#LeftPadding#+#PlayIconX#)
Y=(#BackgroundHeight#-#MediaIconY#)
FontSize=#PlayIconSize#
StringAlign=CenterCenter
Text=[\xF5B0]
Group=Play
UpdateDivider=-1

[PauseIcon]
; Shows the "pause" icon (Windows 11 style, Segoe Fluent Icons).
Meter=String
MeterStyle=StyleFluentIcon
X=(#LeftPadding#+#PlayIconX#)
Y=(#BackgroundHeight#-#MediaIconY#)
FontSize=#PlayIconSize#
StringAlign=CenterCenter
Text=[\xF8AE]
Group=Pause
UpdateDivider=-1


; ------------------------------------------------------------------------
; METERS - Next Track
; ------------------------------------------------------------------------

[NextButton]
; Goes to next Spotify track when clicked.
Meter=Image
X=([PlayPauseCircle:X]+41)
Y=([PlayPauseCircle:Y]+5)
W=21
H=22
SolidColor=#Transparent#
Group=SpotifyOn
LeftMouseUpAction=[!CommandMeasure MeasureMediaScript "Send('next')"]
UpdateDivider=-1

[NextIcon]
; Shows the "next track" icon (Windows 11 style, Segoe Fluent Icons).
Meter=String
MeterStyle=StyleFluentIcon
X=(#LeftPadding#+#NextIconX#)
Y=(#BackgroundHeight#-#MediaIconY#)
FontSize=#MediaIconSize#
StringAlign=CenterCenter
Text=[\xF8AD]
UpdateDivider=-1


; ------------------------------------------------------------------------
; METERS - Cover
; ------------------------------------------------------------------------

[CardMask]
; Invisible rounded mask matching the Windows 11 card; clips cover art and progress bar to the rounded corners.
Meter=Shape
X=0
Y=0
Shape=Rectangle 0,0,#BackgroundWidth#,#BackgroundHeight#,#CornerRadius# | Fill Color 255,255,255 | StrokeWidth 0
UpdateDivider=-1

[MeterDefaultCoverBackground]
; Shows the default cover background (for when a cover is not available or Spotify is closed).
; Opens Spotify when clicked.
Meter=Image
Container=CardMask
X=1
Y=2
W=50
H=[MeterDefaultCoverBackground:W]
SolidColor=#SpotifyBackground#
LeftMouseUpAction=["spotify:"]
MouseActionCursor=1
UpdateDivider=-1

[MeterDefaultCoverForeground]
; Shows the default cover foreground; i.e. a gray CD (for when a cover is not available or Spotify is closed).
Meter=Roundline
Container=CardMask
X=26
Y=([MeterDefaultCoverForeground:X]+1)
AntiAlias=1
RotationAngle=(Rad(360))
LineStart=18.8
LineLength=6
LineColor=#SpotifyForeground#
Solid=1
UpdateDivider=-1

[MeterCover]
; Shows cover image of currently playing Spotify track.
Meter=Image
Container=CardMask
ImageName=[MeasureCover]
X=1
Y=2
W=[MeterDefaultCoverBackground:W]
H=[MeterCover:W]
DynamicVariables=1
AntiAlias=1
Group=SpotifyOn
UpdateDivider=-1


; ------------------------------------------------------------------------
; METERS - Bar
; ------------------------------------------------------------------------

[MeterBar]
; Shows a bar that represents progress of currently playing Spotify track.
Meter=Bar
Container=CardMask
MeasureName=MeasureProgress
X=1
Y=(#BackgroundHeight#-5)
W=(#BackgroundWidth#-2)
H=4
SolidColor=#SolidGreyIcon#
Group=SpotifyOn
BarColor=#BarColor#
BarOrientation=Horizontal
UpdateDivider=-1

[MeterBarOff]
; Shows green bar when Spotify is closed.
Meter=Image
Container=CardMask
X=[MeterBar:X]
Y=[MeterBar:Y]
W=[MeterBar:W]
H=[MeterBar:H]
SolidColor=#BarColor#
Group=SpotifyOff
UpdateDivider=-1


; ------------------------------------------------------------------------
; METERS - Text
; ------------------------------------------------------------------------

[MeterTime]
; Shows position and length of currently playing Spotify track.
Meter=String
MeterStyle=StyleTinyTextSpotify
MeasureName=MeasurePosition
MeasureName2=MeasureLength
X=(#BackgroundWidth#-4)
Y=([MeterBar:Y]-18)
Group=SpotifyOn
Text="%1 / %2"
UpdateDivider=-1
Hidden=1

[MeterTimeOff]
; Shows "0:00 / 0:00" when Spotify is closed.
Meter=String
MeterStyle=StyleTinyTextSpotify
X=(#BackgroundWidth#-4)
Y=[MeterTime:Y]
Group=SpotifyOff
Text="0:00 / 0:00"
UpdateDivider=-1
Hidden=1

[MeterTrack]
; Shows name of currently playing Spotify track.
Meter=String
MeterStyle=StyleSmallTextSpotify
MeasureName=MeasureTrack
X=([NextButton:X]+29)
Y=(#BackgroundHeight#-49)
ClipString=2
ClipStringW=(#BackgroundWidth#-[MeterTrack:X]-9)
Group=SpotifyOn
Text="%1"
FontFace=Segoe UI Variable Text
FontWeight=600
UpdateDivider=-1

[MeterArtist]
; Shows artist of currently playing Spotify track.
Meter=String
MeterStyle=StyleSmallTextSpotify
MeasureName=MeasureArtist
X=0r
Y=-2R
ClipString=2
ClipStringW=(#BackgroundWidth#-[MeterArtist:X]-[MeterTime:W]-8)
Group=SpotifyOn
Text="%1"
DynamicVariables=1
UpdateDivider=-1

[MeterTrackOff]
; Shows "Track" when Spotify is closed.
Meter=String
MeterStyle=StyleSmallTextSpotify
X=[MeterTrack:X]
Y=[MeterTrack:Y]
Group=SpotifyOff
Text="Track"
FontFace=Segoe UI Variable Text
FontWeight=600
UpdateDivider=-1

[MeterArtistOff]
; Shows "Artist" when Spotify is closed.
Meter=String
MeterStyle=StyleSmallTextSpotify
X=0r
Y=-2R
Group=SpotifyOff
Text="Artist"
UpdateDivider=-1
