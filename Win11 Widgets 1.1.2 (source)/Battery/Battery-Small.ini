[Metadata]
Name=Battery (small)
Author=ketamine (based on Win10 Widgets by TJ Markham)
Information=Displays the current battery status.
License=Creative Commons BY-NC-SA 4.0
Version=1.1.2

[Variables]
@Include=Battery-Medium.ini
BackgroundHeight=54
TopPadding=-7
LeftPadding=78
BatteryIconX=13

; ------------------------------------------------------------------------
; METERS - Text
; ------------------------------------------------------------------------

[MeterBatteryPercent]
MeterStyle=StyleSmallText | StyleWhiteText
Y=(#TopPadding#+23)

[Percent]
MeterStyle=StyleSmallText | StyleWhiteText
X=-4R

[MeterBatteryHours]
Y=0r

[MeterBatteryMinutes]

[Remaining]

[ChargingStatus]

[ChargedStatus]

[Calculating]
