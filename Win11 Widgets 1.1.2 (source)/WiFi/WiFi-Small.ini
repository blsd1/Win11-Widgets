; Known bug(s):
; - None

[Rainmeter]
Update=1000
; Context menu option to show signal strength percent
ContextTitle="Show % signal strength"
ContextAction=[!WriteKeyValue WiFiPercent FontColor #SolidGreyText# #CoreFilePath#][!Refresh]
; Context menu option to hide signal strength percent
ContextTitle2="Hide % signal strength"
ContextAction2=[!WriteKeyValue WiFiPercent FontColor #Transparent# #CoreFilePath#][!Refresh]

[Metadata]
Name=WiFi (small)
Author=ketamine (based on Win10 Widgets by TJ Markham)
Information=Displays the current WiFi status.
License=Creative Commons BY-NC-SA 4.0
Version=1.1.2

[Variables]
@Include1=#@#variables.ini
@Include2=#@#styles.ini
@Include3=#@#background.ini
CoreFilePath=""#CURRENTPATH#WiFi-Small.ini""
BackgroundHeight=68
LeftPadding=13
TopPadding=10
WifiIconSize=17
WifiIconYOffset=4
AutoBorder=1


; ------------------------------------------------------------------------
; MEASURES
; ------------------------------------------------------------------------

[MeasureSSID]
; Returns the SSID of the current WiFi network.
Measure=Plugin
Plugin=WiFiStatus
WiFiInfoType=SSID
OnChangeAction=[!UpdateMeter WiFiSSID]

[MeasureWiFiSecurity]
; Returns the security type of the current WiFi network (NONE, WEP40, TKIP, AES, WEP104, WPA_GROUP, WEP, or ??? for an unknown algorithm).
; Controls the secured/open text.
Measure=Plugin
Plugin=WiFiStatus
WiFiInfoType=Encryption
OnChangeAction=[!UpdateMeter Security]
IfMatch=NONE
IfMatchAction=[!SetOption Security Text ", open"][!ShowMeterGroup OpenIcon]
IfNotMatchAction=[!SetOption Security Text ", secured"][!HideMeterGroup OpenIcon]
IfCondition=(MeasureWiFiPercent < 1)
IfTrueAction=[!HideMeterGroup OpenIcon]

[MeasureWiFiPercent]
; Returns the percent strength the current WiFi signal.
; Controls which signal-strength glyph is shown in the WiFi icon.
Measure=Plugin
Plugin=WiFiStatus
WiFiInfoType=Quality
OnChangeAction=[!UpdateMeter WiFiPercent]
; 0%
IfCondition=(MeasureWiFiPercent < 1) 
IfTrueAction=[!SetOption WifiIconLevel Text ""][!HideMeterGroup Connected][!ShowMeterGroup Unconnected][!UpdateMeterGroup WifiIcon]
; 1%-25%
IfCondition2=(MeasureWiFiPercent >= 1) && (MeasureWiFiPercent <= 25)
IfTrueAction2=[!SetOption WifiIconLevel Text "[\xE872]"][!ShowMeterGroup Connected][!HideMeterGroup Unconnected][!UpdateMeterGroup WifiIcon]
; 26%-50%
IfCondition3=(MeasureWiFiPercent >= 26) && (MeasureWiFiPercent <= 50)
IfTrueAction3=[!SetOption WifiIconLevel Text "[\xE873]"][!ShowMeterGroup Connected][!HideMeterGroup Unconnected][!UpdateMeterGroup WifiIcon]
; 51%-75%
IfCondition4=(MeasureWiFiPercent >= 51) && (MeasureWiFiPercent <= 75)
IfTrueAction4=[!SetOption WifiIconLevel Text "[\xE874]"][!ShowMeterGroup Connected][!HideMeterGroup Unconnected][!UpdateMeterGroup WifiIcon]
; 76%-100%
IfCondition5=(MeasureWiFiPercent >= 76)
IfTrueAction5=[!SetOption WifiIconLevel Text "[\xE701]"][!ShowMeterGroup Connected][!HideMeterGroup Unconnected][!UpdateMeterGroup WifiIcon]

[MeasureInternetConnectivity]
; Returns the status of the internet connection.
Measure=Plugin
Plugin=SysInfo
SysInfoType=INTERNET_CONNECTIVITY
Substitute="-1":"No Internet","1":"Connected"
OnChangeAction=[!UpdateMeter ConnectedLabel]


; ------------------------------------------------------------------------
; METERS - WiFi Icon
; ------------------------------------------------------------------------

[WifiIconBack]
; Shows the full WiFi icon (Windows 11 style, Segoe Fluent Icons) in the inactive color; the signal strength is drawn on top of it.
Meter=String
MeterStyle=StyleFluentIcon
X=#LeftPadding#
Y=(#TopPadding#+#WifiIconYOffset#)
FontSize=#WifiIconSize#
FontColor=#IconColorInactive#
Group=WifiIcon
Text=[\xE701]
UpdateDivider=-1

[WifiIconLevel]
; Shows the part of the WiFi icon that represents the current signal strength (set by MeasureWiFiPercent).
Meter=String
MeterStyle=StyleFluentIcon
X=0r
Y=0r
FontSize=#WifiIconSize#
FontColor=#IconColorActive#
Group=WifiIcon
Text=""
DynamicVariables=1
UpdateDivider=-1


; ------------------------------------------------------------------------
; METERS - Open network icon
; ------------------------------------------------------------------------

[WifiOpenIcon]
; Shows a warning shield on the WiFi icon when the network is open (unsecured).
Meter=String
MeterStyle=StyleFluentIcon
X=([WifiIconBack:X]+(#WifiIconSize#*0.95))
Y=([WifiIconBack:Y]+(#WifiIconSize#*0.9))
FontSize=(#WifiIconSize#*0.5)
Group=OpenIcon
Text=[\xE730]
DynamicVariables=1
UpdateDivider=-1

; ------------------------------------------------------------------------
; METERS - Text
; ------------------------------------------------------------------------

[WiFiSSID]
; Shows the SSID of the current WiFi network.
Meter=String
MeterStyle=StyleSmallText | StyleWhiteText
MeasureName=MeasureSSID
X=(#LeftPadding#+35)
Y=(#TopPadding#+3)
Group=Connected
Text="%1"
ClipString=2
ClipStringW=(#BackgroundWidth#-55)
DynamicVariables=1
UpdateDivider=-1

[ConnectedLabel]
; Shows the internet connection status.
Meter=String
MeterStyle=StyleSmallText
MeasureName=MeasureInternetConnectivity
X=0r
Y=0R
Group=Connected
Text="%1"
UpdateDivider=-1

[Security]
; Shows if the current WiFi network is secure or not.
Meter=String
MeterStyle=StyleSmallText
X=-4R
Y=0r
Group=Connected
Text="???"
UpdateDivider=-1

[WiFiPercent]
; Shows the percent strength the current WiFi signal.
Meter=String
MeterStyle=StyleSmallText
MeasureName=MeasureWiFiPercent
X=0R
Y=0r
Group=Connected
Text="(%1% signal strength)"
UpdateDivider=-1
FontColor=178,178,178,255

[WiFiLabel]
; Shows "WiFi".
Meter=String
MeterStyle=StyleSmallText | StyleWhiteText
X=(#LeftPadding#+35)
Y=(#TopPadding#+3)
Group=Unconnected
Text="Wi-Fi"
UpdateDivider=-1

[NotConnectedLabel]
; Shows "Not connected".
Meter=String
MeterStyle=StyleSmallText
X=0r
Y=-1R
Group=Unconnected
Text="Not connected"
UpdateDivider=-1
