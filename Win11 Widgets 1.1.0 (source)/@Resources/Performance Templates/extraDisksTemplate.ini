; About:
;	Shows an extra disk monitor for every connected drive (other than the
;	main #Disk#), up to five. Drives that are not connected are not shown.
;	Drives are re-checked every 5 seconds; when the set of drives changes,
;	the widget resizes itself and refreshes.

; Required Variables:
;	- ExtraDiskLayout0 .. ExtraDiskLayout5 - layout for 0..5 extra drives, e.g.
;	  "d=160,61|11,161 net=160,111 gpu=11,111 size=361,212"
;	  (d = extra disks, net = network, gpu = GPU, size = widget W,H)

[Variables]
ExtraDisks=
XDX1=0
XDY1=0
XDX2=0
XDY2=0
XDX3=0
XDY3=0
XDX4=0
XDY4=0
XDX5=0
XDY5=0


; ------------------------------------------------------------------------
; MEASURES - Drive detection
