[MeasureExtraDisksScript]
; Picks connected drives, places their monitors, and resizes the widget.
Measure=Script
ScriptFile=#@#Scripts\extraDisks.lua
UpdateDivider=50


; ------------------------------------------------------------------------
; Extra disk 1
; ------------------------------------------------------------------------

[MeasureXDisk1]
Measure=Plugin
Plugin=PerfMon
PerfMonObject=LogicalDisk
PerfMonCounter="% Disk Time"
PerfMonInstance=C:
OnUpdateAction=[!UpdateMeasure MeasureXDiskScale1]
Disabled=1
UpdateDivider=10

[MeasureXDiskScale1]
Measure=Calc
Formula=((MeasureXDisk1/100000) < 100 ? (MeasureXDisk1/100000) : 100)
OnUpdateAction=[!UpdateMeter XDGraph1][!UpdateMeter XDGraphBackground1][!UpdateMeter XDValue1]
MaxValue=100
MinValue=0
Disabled=1
UpdateDivider=-1

[XDGraph1]
Meter=Line
MeasureName=MeasureXDiskScale1
X=(#XDX1#+1)
Y=(#XDY1#+1)
W=(#GraphWidth#-1)
H=(#GraphHeight#-2)
AntiAlias=1
Group=XDisk1
LineCount=1
LineColor=#DiskGreen#
LineWidth=1
UpdateDivider=-1
Hidden=1

[XDGraphBackground1]
Meter=Histogram
MeasureName=MeasureXDiskScale1
X=(#XDX1#+1)
Y=#XDY1#
W=(#GraphWidth#-1)
H=(#GraphHeight#-1)
AntiAlias=1
Group=XDisk1
PrimaryColor=#DiskGreen#,30
UpdateDivider=-1
Hidden=1

[XDTop1]
Meter=Image
X=#XDX1#
Y=#XDY1#
W=#GraphWidth#
H=1
SolidColor=#DiskGreen#
Group=XDisk1
UpdateDivider=-1
Hidden=1

[XDLeft1]
Meter=Image
X=0r
Y=0r
W=1
H=#GraphHeight#
SolidColor=#DiskGreen#
Group=XDisk1
UpdateDivider=-1
Hidden=1

[XDBottom1]
Meter=Image
X=0r
Y=-1R
W=#GraphWidth#
H=1
SolidColor=#DiskGreen#
Group=XDisk1
UpdateDivider=-1
Hidden=1

[XDRight1]
Meter=Image
X=(#GraphWidth#-1)r
Y=#XDY1#
W=1
H=#GraphHeight#
SolidColor=#DiskGreen#
Group=XDisk1
UpdateDivider=-1
Hidden=1

[XDLabel1]
Meter=String
MeterStyle=StyleSmallText | StyleWhiteText
X=9r
Y=-4r
Group=XDisk1
Text="Disk"
UpdateDivider=-1
Hidden=1

[XDValue1]
Meter=String
MeterStyle=StyleSmallText
MeasureName=MeasureXDiskScale1
X=1r
Y=-2R
Group=XDisk1
Text="%1%"
FontSize=9
UpdateDivider=-1
Hidden=1

