; ------------------------------------------------------------------------
;
;	Win11 Widgets for Rainmeter - Weather (ExtraLarge)
;		Author   - ketamine
;		Based on - Win10 Widgets by TJ Markham (http://win10widgets.com)
;		License  - Creative Commons BY-NC-SA 4.0
;
; ------------------------------------------------------------------------

; Known bug(s):
; - Sometimes the OnWakeAction is not executed after computer wakes up. 
;	Not sure what the reason behind this is, I suspect it has to do 
;	with the auto-wakeup feature in Windows 10 (used for updates). To fix,
;	simply click the "Refresh" button or refresh the skin.
; - Weather data is from Open-Meteo (https://open-meteo.com) and IP 
;	location from ipinfo.io. If either service is down, the "Connection 
;	Error" overlay is shown; click "Refresh" to try again.

[Rainmeter]
Update=100
; Check internet connectivity when computer wakes up.
OnWakeAction=[!Log "Awake!"][!UpdateMeasure MeasureInternetConnectivity]
; Context menu option to auto-select location based on user's IP.
ContextTitle="Auto-location"
ContextAction=[!WriteKeyValue Variables AutoLocation 1 #CoreFilePath#][!WriteKeyValue Variables FirstStep "MeasureIPLocation" #CoreFilePath#][!WriteKeyValue Variables Latitude "" #CoreFilePath#][!WriteKeyValue Variables Longitude "" #CoreFilePath#][!WriteKeyValue Variables City "" #CoreFilePath#][!WriteKeyValue Variables Region "" #CoreFilePath#][!Refresh]
; Context menu option to change location based on user supplied city or postal code.
ContextTitle2="Set location	(auto: off)"
ContextAction2=[!ShowMeterGroup LocationOverlay][!SetOption MeasureLocationInput DefaultValue "#Location#"][!SetOption LocationInputOverlay Text "#Location#"][!UpdateMeter LocationInputOverlay][!CommandMeasure MeasureLocationInput "ExecuteBatch All"]
; Context menu separator.
ContextTitle3="-"
; Context menu option to change units to imperial units (Fahrenheit, mph, mi, in, etc.).
ContextTitle4="Imperial units (F)"
ContextAction4=[!SetVariable MetricUnits 0][!WriteKeyValue Variables MetricUnits 0 #CoreFilePath#][!UpdateMeasure MeasureUnits]
; Context menu option to change units to metric units (Celsius, km/h, km, mb, etc.).
ContextTitle5="Metric units (C)"
ContextAction5=[!SetVariable MetricUnits 1][!WriteKeyValue Variables MetricUnits 1 #CoreFilePath#][!UpdateMeasure MeasureUnits]
; Context menu separator.
ContextTitle6="-"
; Context menu option to change times to 12-hour format.
ContextTitle7="12-hour time"
ContextAction7=[!SetVariable 24HourTime 0][!WriteKeyValue Variables 24HourTime 0 #CoreFilePath#][!UpdateMeasure MeasureTimeFormat]
; Context menu option to change times to 24-hour format.
ContextTitle8="24-hour time"
ContextAction8=[!SetVariable 24HourTime 1][!WriteKeyValue Variables 24HourTime 1 #CoreFilePath#][!UpdateMeasure MeasureTimeFormat]

[Metadata]
Name=Weather (ExtraLarge)
Author=ketamine (based on Win10 Widgets by TJ Markham)
Information=Displays the current/future weather based on IP location or user-supplied city/postal code (data from Open-Meteo.com).
License=Creative Commons BY-NC-SA 4.0
Version=1.1.0

[Variables]
@Include1=#@#systemColors.ini
@Include2=#@#variables.ini
@Include3=#@#styles.ini
@Include4=#@#background.ini
CoreFilePath=""#CURRENTPATH#Weather-ExtraLarge.ini""
BackgroundHeight=212
AutoBorder=1
; Location used for the weather (set automatically from IP address unless set by the user).
Latitude=




Longitude=




City=




Region=




AutoLocation=1
FirstStep=MeasureIPLocation
UpdateRate=16425
Location=""
WindDirection=360
MetricUnits=1
24HourTime=1
UnitTemp="F"
UnitSpeed="mph"
UnitDistance="mi"
UnitPressure="in"


; ------------------------------------------------------------------------
; MEASURES
; ------------------------------------------------------------------------

[MeasureUnits]
; Sets units depending on status of #MetricUnits# (which is controlled by context menu options).
Measure=Calc
; 0: Imperial Units, 1: Metric Units
IfCondition=(#MetricUnits#=0)
IfTrueAction=[!SetVariable UnitTemp "F"][!SetOption MeterTemp MeasureName MeasureTempF][!SetOption MeterFeelsLike MeasureName MeasureTempF][!SetOption MeterDay1High MeasureName MeasureDay1HighF][!SetOption MeterDay1Low MeasureName MeasureDay1LowF][!SetOption MeterDay2High MeasureName MeasureDay2HighF][!SetOption MeterDay2Low MeasureName MeasureDay2LowF][!SetOption MeterDay3High MeasureName MeasureDay3HighF][!SetOption MeterDay3Low MeasureName MeasureDay3LowF][!SetOption MeterDay4High MeasureName MeasureDay4HighF][!SetOption MeterDay4Low MeasureName MeasureDay4LowF][!SetOption MeterDay5High MeasureName MeasureDay5HighF][!SetOption MeterDay5Low MeasureName MeasureDay5LowF][!SetVariable UnitSpeed "mph"][!SetOption MeterWind MeasureName MeasureWindSpeedMPH][!SetVariable UnitDistance "mi"][!SetOption MeterVisibility MeasureName MeasureVisibilityMI][!SetVariable UnitPressure "in"][!SetOption MeterBarometer MeasureName MeasureBarometerIN][!UpdateMeterGroup UnitMeters]
IfFalseAction=[!SetVariable UnitTemp "C"][!SetOption MeterTemp MeasureName MeasureTempC][!SetOption MeterFeelsLike MeasureName MeasureTempC][!SetOption MeterDay1High MeasureName MeasureDay1HighC][!SetOption MeterDay1Low MeasureName MeasureDay1LowC][!SetOption MeterDay2High MeasureName MeasureDay2HighC][!SetOption MeterDay2Low MeasureName MeasureDay2LowC][!SetOption MeterDay3High MeasureName MeasureDay3HighC][!SetOption MeterDay3Low MeasureName MeasureDay3LowC][!SetOption MeterDay4High MeasureName MeasureDay4HighC][!SetOption MeterDay4Low MeasureName MeasureDay4LowC][!SetOption MeterDay5High MeasureName MeasureDay5HighC][!SetOption MeterDay5Low MeasureName MeasureDay5LowC][!SetVariable UnitSpeed "km/h"][!SetOption MeterWind MeasureName MeasureWindSpeedKPH][!SetVariable UnitDistance "km"][!SetOption MeterVisibility MeasureName MeasureVisibilityKM][!SetVariable UnitPressure "mb"][!SetOption MeterBarometer MeasureName MeasureBarometerMB][!UpdateMeterGroup UnitMeters]
DynamicVariables=1
UpdateDivider=-1

[MeasureTimeFormat]
; Sets 12-hr or 24-hr time format depending on #24Hourtime# (which is controlled by context menu options).
Measure=Calc
; 0: 12-hr time format, 1: 24-hr time format
IfCondition=(#24HourTime#=0)
IfTrueAction=[!SetOption MeasureTime Format "%#I:%M %p"][!UpdateMeasure MeasureTime][!UpdateMeter MeterLocation][!SetOption MeterSunrise MeasureName MeasureSunrise12][!UpdateMeter MeterSunrise][!SetOption MeterSunset MeasureName MeasureSunset12][!UpdateMeter MeterSunset]
IfFalseAction=[!SetOption MeasureTime Format "%#H:%M"][!UpdateMeasure MeasureTime][!UpdateMeter MeterLocation][!SetOption MeterSunrise MeasureName MeasureSunrise24][!UpdateMeter MeterSunrise][!SetOption MeterSunset MeasureName MeasureSunset24][!UpdateMeter MeterSunset]
DynamicVariables=1
UpdateDivider=-1

[MeasureAutoLocation]
; Changes data flow depending on whether auto-location is turned on or not.
Measure=Calc
; 0: Auto-location off, 1: Auto-location on
IfCondition=(#AutoLocation#=0)
IfTrueAction=[!DisableMeasure MeasureIPLocation][!EnableMeasure MeasureWeather][!SetOption MeasureWeather UpdateDivider #UpdateRate#]
IfFalseAction=[!EnableMeasure MeasureIPLocation]
UpdateDivider=-1

[MeasureInternetConnectivity]
; Returns the status of the internet connection.
; Changes error text depending on situation.
Measure=Plugin
Plugin=SysInfo
SysInfoType=INTERNET_CONNECTIVITY
; -1: No Internet, 1: Connected
IfCondition=(MeasureInternetConnectivity=-1)
;IfTrueAction=[!Log "Lost Internet..."]
IfTrueAction=[!SetOption PreButtonText2 Text "Connect to internet and try again."]
;IfFalseAction=[!Log "Found Internet..."]
IfFalseAction=[!SetOption PreButtonText2 Text "Try again in a couple seconds."][!UpdateMeasure #FirstStep#]
;[!CommandMeasure #FirstStep# Update]

[MeasureIPLocation]
; Returns approximate location (city, region, latitude, longitude) based on IP address.
; Success action: Applies the location and initiates MeasureWeather.
; Failure action: Shows RefreshOverlay
Measure=Plugin
Plugin=WebParser.dll
URL=https://ipinfo.io/json
RegExp=(?siU)"city":\s*"(.*)".*"region":\s*"(.*)".*"loc":\s*"(.*),(.*)"
FinishAction=[!UpdateMeasureGroup IPLocationMeasures][!EnableMeasure MeasureApplyIPLocation][!UpdateMeasure MeasureApplyIPLocation]
OnConnectErrorAction=[!HideMeterGroup WeatherMeters][!ShowMeter RetrievingWeather][!SetOption RefreshButton MouseLeaveAction "[!HideMeter RefreshButtonHoverEdge][!ShowMeter RefreshButtonEdge][!ShowMeter RefreshButtonCenter]"][!UpdateMeter RefreshButton][!ShowMeterGroup RefreshOverlay][!HideMeter RefreshButtonHoverEdge]
OnRegExpErrorAction=[!HideMeterGroup WeatherMeters][!ShowMeter RetrievingWeather][!SetOption RefreshButton MouseLeaveAction "[!HideMeter RefreshButtonHoverEdge][!ShowMeter RefreshButtonEdge][!ShowMeter RefreshButtonCenter]"][!UpdateMeter RefreshButton][!ShowMeterGroup RefreshOverlay][!HideMeter RefreshButtonHoverEdge]
UpdateDivider=#UpdateRate#
UpdateRate=1

[MeasureIPCity]
Measure=Plugin
Plugin=WebParser.dll
URL=[MeasureIPLocation]
StringIndex=1
Group=IPLocationMeasures
UpdateDivider=-1

[MeasureIPRegion]
Measure=Plugin
Plugin=WebParser.dll
URL=[MeasureIPLocation]
StringIndex=2
Group=IPLocationMeasures
UpdateDivider=-1

[MeasureIPLatitude]
Measure=Plugin
Plugin=WebParser.dll
URL=[MeasureIPLocation]
StringIndex=3
Group=IPLocationMeasures
UpdateDivider=-1

[MeasureIPLongitude]
Measure=Plugin
Plugin=WebParser.dll
URL=[MeasureIPLocation]
StringIndex=4
Group=IPLocationMeasures
UpdateDivider=-1

[MeasureApplyIPLocation]
; Uses the IP-based location for the weather and initiates MeasureWeather (enabled by MeasureIPLocation once it has data).
Measure=String
OnUpdateAction=[!SetOption RefreshButton MouseLeaveAction "[]"][!UpdateMeter RefreshButton][!HideMeterGroup RefreshOverlay][!SetVariable Latitude "[MeasureIPLatitude]"][!SetVariable Longitude "[MeasureIPLongitude]"][!SetVariable City "[MeasureIPCity]"][!SetVariable Region "[MeasureIPRegion]"][!EnableMeasure MeasureWeather][!UpdateMeasure MeasureWeather]
DynamicVariables=1
Disabled=1
UpdateDivider=-1

[MeasureLocationSearch]
; Looks up the user-provided location (city, address or postal code) via findLocation.ps1 (OpenStreetMap).
; Returns "OK|latitude|longitude|city|country", "NOTFOUND" or "ERROR".
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -File "#CURRENTPATH#findLocation.ps1" "[MeasureLocationInput]"
State=Hide
OutputType=UTF8
Timeout=30000
FinishAction=[!UpdateMeasure MeasureLocationResult]
DynamicVariables=1
UpdateDivider=-1

[MeasureLocationResult]
; Saves the location if it was found, otherwise shows an error.
Measure=String
String=[MeasureLocationSearch]
IfMatch=^OK\|
IfMatchAction=[!UpdateMeasureGroup LocationSearchMeasures][!EnableMeasure MeasureSaveLocation][!UpdateMeasure MeasureSaveLocation]
IfMatch2=^NOTFOUND
IfMatchAction2=[!HideMeter CheckingLocationText][!ShowMeter ErrorText]
IfMatch3=^ERROR
IfMatchAction3=[!HideMeterGroup WeatherMeters][!ShowMeter RetrievingWeather][!SetOption RefreshButton MouseLeaveAction "[!HideMeter RefreshButtonHoverEdge][!ShowMeter RefreshButtonEdge][!ShowMeter RefreshButtonCenter]"][!UpdateMeter RefreshButton][!ShowMeterGroup RefreshOverlay][!HideMeter RefreshButtonHoverEdge]
IfMatchMode=1
DynamicVariables=1
UpdateDivider=-1

[MeasureSearchLatitude]
Measure=String
String=[MeasureLocationSearch]
RegExpSubstitute=1
Substitute="^OK\|([^|]*)\|.*$":"\1"
DynamicVariables=1
Group=LocationSearchMeasures
UpdateDivider=-1

[MeasureSearchLongitude]
Measure=String
String=[MeasureLocationSearch]
RegExpSubstitute=1
Substitute="^OK\|[^|]*\|([^|]*)\|.*$":"\1"
DynamicVariables=1
Group=LocationSearchMeasures
UpdateDivider=-1

[MeasureSearchCity]
Measure=String
String=[MeasureLocationSearch]
RegExpSubstitute=1
Substitute="^OK\|[^|]*\|[^|]*\|([^|]*)\|.*$":"\1"
DynamicVariables=1
Group=LocationSearchMeasures
UpdateDivider=-1

[MeasureSearchCountry]
Measure=String
String=[MeasureLocationSearch]
RegExpSubstitute=1
Substitute="^OK\|[^|]*\|[^|]*\|[^|]*\|([^|\r\n]*).*$":"\1"
DynamicVariables=1
Group=LocationSearchMeasures
UpdateDivider=-1

[MeasureSaveLocation]
; Saves the location found by MeasureLocationSearch and refreshes (enabled by MeasureLocationSearch once it has data).
Measure=String
OnUpdateAction=[!WriteKeyValue Variables AutoLocation 0 #CoreFilePath#][!WriteKeyValue Variables FirstStep "MeasureWeather" #CoreFilePath#][!WriteKeyValue Variables Latitude "[MeasureSearchLatitude]" #CoreFilePath#][!WriteKeyValue Variables Longitude "[MeasureSearchLongitude]" #CoreFilePath#][!WriteKeyValue Variables City "[MeasureSearchCity]" #CoreFilePath#][!WriteKeyValue Variables Region "[MeasureSearchCountry]" #CoreFilePath#][!Refresh]
DynamicVariables=1
Disabled=1
UpdateDivider=-1

[MeasureWeather]
; Returns current conditions and 5-day forecast from Open-Meteo (temperatures in Fahrenheit, wind in km/h, pressure in mb, visibility in meters).
Measure=Plugin
Plugin=WebParser.dll
URL=https://api.open-meteo.com/v1/forecast?latitude=#Latitude#&longitude=#Longitude#&current=temperature_2m,apparent_temperature,relative_humidity_2m,is_day,weather_code,wind_speed_10m,wind_direction_10m,pressure_msl,visibility&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset&temperature_unit=fahrenheit&wind_speed_unit=kmh&timezone=auto&forecast_days=6
; Current: 1 temp, 2 feels like, 3 humidity, 4 is day, 5 code, 6 wind speed, 7 wind direction, 8 pressure, 9 visibility
; Daily (6 days are fetched; today is skipped so the forecast starts tomorrow): 10-14 dates, 15-19 codes, 20-24 highs, 25-29 lows, 30 sunrise (today), 31 sunset (today)
RegExp=(?siU)"current":\{.*"temperature_2m":(.*),"apparent_temperature":(.*),"relative_humidity_2m":(.*),"is_day":(.*),"weather_code":(.*),"wind_speed_10m":(.*),"wind_direction_10m":(.*),"pressure_msl":(.*),"visibility":(.*)\}.*"daily":\{"time":\["[^"]*","(.*)","(.*)","(.*)","(.*)","(.*)"\],"weather_code":\[[^,]*,(.*),(.*),(.*),(.*),(.*)\],"temperature_2m_max":\[[^,]*,(.*),(.*),(.*),(.*),(.*)\],"temperature_2m_min":\[[^,]*,(.*),(.*),(.*),(.*),(.*)\],"sunrise":\["(.*)".*"sunset":\["(.*)"
OnUpdateAction=[!Log "Retrieving weather..."]
FinishAction=[!Log "Retrieved weather."][!SetOption RefreshButton MouseLeaveAction "[]"][!UpdateMeter RefreshButton][!HideMeterGroup RefreshOverlay][!UpdateMeasureGroup WeatherMeasures][!ShowMeterGroup WeatherMeters][!UpdateMeterGroup WeatherMeters][!HideMeter RetrievingWeather]
OnConnectErrorAction=[!HideMeterGroup WeatherMeters][!ShowMeter RetrievingWeather][!SetOption RefreshButton MouseLeaveAction "[!HideMeter RefreshButtonHoverEdge][!ShowMeter RefreshButtonEdge][!ShowMeter RefreshButtonCenter]"][!UpdateMeter RefreshButton][!ShowMeterGroup RefreshOverlay][!HideMeter RefreshButtonHoverEdge]
OnRegExpErrorAction=[!HideMeterGroup WeatherMeters][!ShowMeter RetrievingWeather][!SetOption RefreshButton MouseLeaveAction "[!HideMeter RefreshButtonHoverEdge][!ShowMeter RefreshButtonEdge][!ShowMeter RefreshButtonCenter]"][!UpdateMeter RefreshButton][!ShowMeterGroup RefreshOverlay][!HideMeter RefreshButtonHoverEdge]
; Enabled by MeasureAutoLocation (location set by user) or MeasureApplyIPLocation (auto-location).
Disabled=1
DynamicVariables=1
UpdateDivider=-1
UpdateRate=1

[MeasureTime]
; Returns time in 12-hour format (omitting first 0 of hour).
Measure=Time
Format=%#I:%M %p
OnChangeAction=[!UpdateMeter MeterUpdatedTime]
Group=WeatherMeasures
UpdateDivider=-1

[MeasureCity]
; Returns city.
Measure=String
String=#City#
OnChangeAction=[!UpdateMeter MeterLocation][!SetVariable Location "[MeasureCity],[MeasureRegion]"][!UpdateMeter LocationInputOverlay]
Group=WeatherMeasures
DynamicVariables=1
UpdateDivider=-1

[MeasureRegion]
; Returns region (or country, if location was set by the user).
Measure=String
String=#Region#
OnChangeAction=[!UpdateMeter MeterLocation][!SetVariable Location "[MeasureCity],[MeasureRegion]"][!UpdateMeter LocationInputOverlay]
Group=WeatherMeasures
DynamicVariables=1
UpdateDivider=-1

[MeasureFeelsLike]
; Returns "feels like" (apparent) temperature in Fahrenheit.
Measure=Plugin
Plugin=WebParser.dll
URL=[MeasureWeather]
StringIndex=2
OnChangeAction=[!UpdateMeasure MeasureFeelsLikeF][!UpdateMeasure MeasureFeelsLikeC]
Group=WeatherMeasures
UpdateDivider=-1

[MeasureFeelsLikeF]
; Returns "feels like" temperature in Fahrenheit
Measure=Calc
Formula=Round(MeasureFeelsLike,0)
OnChangeAction=[!UpdateMeter MeterFeelsLike]
UpdateDivider=-1

[MeasureFeelsLikeC]
; Returns "feels like" temperature in Celsius.
Measure=Calc
Formula=Round(((MeasureFeelsLike-32)*(5/9)),0)
OnChangeAction=[!UpdateMeter MeterFeelsLike]
UpdateDivider=-1

[MeasureWindDirection]
; Returns direction (1-360 degrees) of where wind is blowing from.
Measure=Plugin
Plugin=WebParser.dll
URL=[MeasureWeather]
StringIndex=7
Substitute="":"0"
OnChangeAction=[!SetVariable WindDirection [MeasureWindDirection]][!UpdateMeter MeterWindDirection]
Group=WeatherMeasures
UpdateDivider=-1

[MeasureWindSpeed]
; Returns wind speed in kilometers/hour.
Measure=Plugin
Plugin=WebParser.dll
URL=[MeasureWeather]
StringIndex=6
OnChangeAction=[!UpdateMeasure MeasureWindSpeedKPH][!UpdateMeasure MeasureWindSpeedMPH]
Group=WeatherMeasures
UpdateDivider=-1

[MeasureWindSpeedKPH]
; Returns wind speed in kilometers/hour.
Measure=Calc
Formula=Round(MeasureWindSpeed,0)
OnChangeAction=[!UpdateMeter MeterWind]
UpdateDivider=-1

[MeasureWindSpeedMPH]
; Returns wind speed in miles/hour.
Measure=Calc
Formula=Round((MeasureWindSpeed*#KMtoMIconversionFactor#),0)
OnChangeAction=[!UpdateMeter MeterWind]
UpdateDivider=-1

[MeasureHumidity]
; Returns humidity.
Measure=Plugin
Plugin=WebParser.dll
URL=[MeasureWeather]
StringIndex=3
OnChangeAction=[!UpdateMeter MeterHumidity]
Group=WeatherMeasures
UpdateDivider=-1

[MeasureVisibility]
; Returns visibility in meters.
Measure=Plugin
Plugin=WebParser.dll
URL=[MeasureWeather]
StringIndex=9
OnChangeAction=[!UpdateMeasure MeasureVisibilityKM][!UpdateMeasure MeasureVisibilityMI]
Group=WeatherMeasures
UpdateDivider=-1

[MeasureVisibilityKM]
; Returns visibility in kilometers.
Measure=Calc
Formula=Round((MeasureVisibility/1000),0)
OnChangeAction=[!UpdateMeter MeterVisibility]
UpdateDivider=-1

[MeasureVisibilityMI]
; Returns visibility in miles.
Measure=Calc
Formula=Round(((MeasureVisibility/1000)*#KMtoMIconversionFactor#),0)
OnChangeAction=[!UpdateMeter MeterVisibility]
UpdateDivider=-1

[MeasureBarometer]
; Returns barometer reading (sea level pressure) in millibars.
Measure=Plugin
Plugin=WebParser.dll
URL=[MeasureWeather]
StringIndex=8
OnChangeAction=[!UpdateMeasure MeasureBarometerMB][!UpdateMeasure MeasureBarometerIN]
Group=WeatherMeasures
UpdateDivider=-1

[MeasureBarometerMB]
; Returns barometer reading (pressure) in millibars.
Measure=Calc
Formula=Round(MeasureBarometer,0)
OnChangeAction=[!UpdateMeter MeterBarometer]
UpdateDivider=-1

[MeasureBarometerIN]
; Returns barometer reading (pressure) in inches of mercury.
Measure=Calc
Formula=Round((MeasureBarometer*#MBtoINconversionFactor#),2)
OnChangeAction=[!UpdateMeter MeterBarometer]
UpdateDivider=-1

[MeasureSunrise]
; Returns time of sunrise (e.g. "2026-09-28 06:46").
Measure=Plugin
Plugin=WebParser.dll
URL=[MeasureWeather]
StringIndex=30
RegExpSubstitute=1
Substitute="T":" "
OnChangeAction=[!UpdateMeasure MeasureSunrise12][!UpdateMeasure MeasureSunrise24][!UpdateMeter MeterSunrise]
Group=WeatherMeasures
UpdateDivider=-1

[MeasureSunrise12]
; Returns time of sunrise in 12-hr time format.
Measure=Time
TimeStamp=[MeasureSunrise]
TimeStampFormat=%Y-%m-%d %H:%M
Format=%#I:%M %p
DynamicVariables=1
UpdateDivider=-1

[MeasureSunrise24]
; Returns time of sunrise in 24-hr time format.
Measure=Time
TimeStamp=[MeasureSunrise]
TimeStampFormat=%Y-%m-%d %H:%M
Format=%#H:%M
DynamicVariables=1
UpdateDivider=-1

[MeasureSunset]
; Returns time of sunset (e.g. "2026-09-28 18:37").
Measure=Plugin
Plugin=WebParser.dll
URL=[MeasureWeather]
StringIndex=31
RegExpSubstitute=1
Substitute="T":" "
OnChangeAction=[!UpdateMeasure MeasureSunset12][!UpdateMeasure MeasureSunset24][!UpdateMeter MeterSunset]
Group=WeatherMeasures
UpdateDivider=-1

[MeasureSunset12]
; Returns time of sunset in 12-hr time format.
Measure=Time
TimeStamp=[MeasureSunset]
TimeStampFormat=%Y-%m-%d %H:%M
Format=%#I:%M %p
DynamicVariables=1
UpdateDivider=-1

[MeasureSunset24]
; Returns time of sunset in 24-hr time format.
Measure=Time
TimeStamp=[MeasureSunset]
TimeStampFormat=%Y-%m-%d %H:%M
Format=%#H:%M
DynamicVariables=1
UpdateDivider=-1

; Weather codes: Open-Meteo returns WMO weather codes; the icons in "icons\" (and
;	the condition text) use the old Yahoo condition codes, so WMO codes are
;	converted to the closest Yahoo code below.

[MeasureCurrentCode]
; Returns WMO weather code of the current condition.
Measure=Plugin
Plugin=WebParser.dll
URL=[MeasureWeather]
StringIndex=5
OnChangeAction=[!UpdateMeasure MeasureForecastText][!UpdateMeasure MeasureImageCode]
Group=WeatherMeasures
UpdateDivider=-1

[MeasureIsDay]
; Returns 1 during the day, 0 at night.
Measure=Plugin
Plugin=WebParser.dll
URL=[MeasureWeather]
StringIndex=4
OnChangeAction=[!UpdateMeasure MeasureImageCode]
Group=WeatherMeasures
UpdateDivider=-1

[MeasureForecastText]
; Returns text reflecting the current condition (e.g. "Partly Cloudy").
Measure=String
String=[MeasureCurrentCode]
RegExpSubstitute=1
Substitute="^0$":"Clear","^1$":"Mostly Clear","^2$":"Partly Cloudy","^3$":"Cloudy","^45$":"Fog","^48$":"Freezing Fog","^51$":"Light Drizzle","^53$":"Drizzle","^55$":"Heavy Drizzle","^5[67]$":"Freezing Drizzle","^61$":"Light Rain","^63$":"Rain","^65$":"Heavy Rain","^6[67]$":"Freezing Rain","^71$":"Light Snow","^73$":"Snow","^75$":"Heavy Snow","^77$":"Snow Grains","^80$":"Light Showers","^81$":"Showers","^82$":"Heavy Showers","^85$":"Snow Showers","^86$":"Heavy Snow Showers","^95$":"Thunderstorms","^9[69]$":"Thunderstorms with Hail"
OnChangeAction=[!UpdateMeter MeterForecastText]
DynamicVariables=1
UpdateDivider=-1

[MeasureImageCode]
; Returns icon code for the image of the current condition (with night icons for clear/partly cloudy skies).
Measure=String
String=[MeasureCurrentCode]-[MeasureIsDay]
RegExpSubstitute=1
Substitute="^0-0$":"31","^1-0$":"33","^2-0$":"29","^(\d+)-\d*$":"\1","^0$":"32","^1$":"34","^2$":"30","^3$":"26","^4[58]$":"20","^5[135]$":"9","^5[67]$":"8","^6[13]$":"11","^65$":"12","^6[67]$":"10","^71$":"14","^73$":"16","^75$":"41","^77$":"13","^80$":"40","^81$":"11","^82$":"12","^85$":"14","^86$":"41","^95$":"4","^9[69]$":"3","^-?$":"3200"
OnChangeAction=[!UpdateMeter MeterForecastImage]
DynamicVariables=1
UpdateDivider=-1

[MeasureTemp]
; Returns current temperature in Fahrenheit.
Measure=Plugin
Plugin=WebParser.dll
URL=[MeasureWeather]
StringIndex=1
OnChangeAction=[!UpdateMeasure MeasureTempF][!UpdateMeasure MeasureTempC]
Group=WeatherMeasures
UpdateDivider=-1

[MeasureTempF]
; Returns current temperature in Fahrenheit.
Measure=Calc
Formula=Round(MeasureTemp,0)
OnChangeAction=[!UpdateMeter MeterTemp]
UpdateDivider=-1

[MeasureTempC]
; Returns current temperature in Celsius.
Measure=Calc
Formula=Round(((MeasureTemp-32)*(5/9)),0)
OnChangeAction=[!UpdateMeter MeterTemp]
UpdateDivider=-1

[MeasureDay1Date]
; Returns date of day 1 (e.g. 2026-09-28).
Measure=Plugin
Plugin=WebParser.dll
URL=[MeasureWeather]
StringIndex=10
OnChangeAction=[!UpdateMeasure MeasureDay1]
Group=WeatherMeasures
UpdateDivider=-1

[MeasureDay1]
; Returns abbreviated name of day 1 (e.g. Mon).
Measure=Time
TimeStamp=[MeasureDay1Date]
TimeStampFormat=%Y-%m-%d
Format=%a
FormatLocale=en-US
OnChangeAction=[!UpdateMeter MeterDay1]
DynamicVariables=1
UpdateDivider=-1

[MeasureDay1Low]
; Returns forecasted low temperature for day 1 in Fahrenheit.
Measure=Plugin
Plugin=WebParser.dll
URL=[MeasureWeather]
StringIndex=25
OnChangeAction=[!UpdateMeasure MeasureDay1LowF][!UpdateMeasure MeasureDay1LowC]
Group=WeatherMeasures
UpdateDivider=-1

[MeasureDay1LowF]
; Returns forecasted low temperature for day 1 in Fahrenheit.
Measure=Calc
Formula=Round(MeasureDay1Low,0)
OnChangeAction=[!UpdateMeter MeterDay1Low]
UpdateDivider=-1

[MeasureDay1LowC]
; Returns forecasted low temperature for day 1 in Celsius.
Measure=Calc
Formula=Round(((MeasureDay1Low-32)*(5/9)),0)
OnChangeAction=[!UpdateMeter MeterDay1Low]
UpdateDivider=-1

[MeasureDay1High]
; Returns forecasted high temperature for day 1 in Fahrenheit.
Measure=Plugin
Plugin=WebParser.dll
URL=[MeasureWeather]
StringIndex=20
OnChangeAction=[!UpdateMeasure MeasureDay1HighF][!UpdateMeasure MeasureDay1HighC]
Group=WeatherMeasures
UpdateDivider=-1

[MeasureDay1HighF]
; Returns forecasted high temperature for day 1 in Fahrenheit.
Measure=Calc
Formula=Round(MeasureDay1High,0)
OnChangeAction=[!UpdateMeter MeterDay1High]
UpdateDivider=-1

[MeasureDay1HighC]
; Returns forecasted high temperature for day 1 in Celsius.
Measure=Calc
Formula=Round(((MeasureDay1High-32)*(5/9)),0)
OnChangeAction=[!UpdateMeter MeterDay1High]
UpdateDivider=-1

[MeasureDay1Code]
; Returns icon code for the image of the forecasted condition for day 1.
Measure=Plugin
Plugin=WebParser.dll
URL=[MeasureWeather]
StringIndex=15
RegExpSubstitute=1
