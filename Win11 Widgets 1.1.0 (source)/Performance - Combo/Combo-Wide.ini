[Metadata]
Name=Performance Combo (wide)
Author=ketamine (based on Win10 Widgets by TJ Markham)
Information=Displays CPU, memory, disk, network, and GPU information.
License=Creative Commons BY-NC-SA 4.0
Version=1.1.0

[Variables]
@Include=Combo.ini
BackgroundHeight=62
BackgroundWidth=860
FirstColumnLeftPadding=11
SecondColumnLeftPadding=160
ThirdColumnLeftPadding=370
FourthColumnLeftPadding=540
FifthColumnLeftPadding=740
FirstRowTopPadding=11
; CPU Variables
GraphLeftPadding1=#FirstColumnLeftPadding#
GraphTopPadding1=#FirstRowTopPadding#
; Memory Variables
GraphLeftPadding2=#SecondColumnLeftPadding#
GraphTopPadding2=#FirstRowTopPadding#
; Disk Variables
GraphLeftPadding3=#ThirdColumnLeftPadding#
GraphTopPadding3=#FirstRowTopPadding#
; Network Variables
GraphLeftPadding4=#FourthColumnLeftPadding#
GraphTopPadding4=#FirstRowTopPadding#
; GPU Variables
GraphLeftPadding5=#FifthColumnLeftPadding#
GraphTopPadding5=#FirstRowTopPadding#
; Extra disk layouts (by number of extra drives; see extraDisksTemplate.ini)
ExtraDiskLayout0=net=540,11 gpu=740,11 size=860,62
ExtraDiskLayout1=d=540,11 net=710,11 gpu=910,11 size=1030,62
ExtraDiskLayout2=d=540,11|710,11 net=880,11 gpu=1080,11 size=1200,62
ExtraDiskLayout3=d=540,11|710,11|880,11 net=1050,11 gpu=1250,11 size=1370,62
ExtraDiskLayout4=d=540,11|710,11|880,11|1050,11 net=1220,11 gpu=1420,11 size=1540,62
ExtraDiskLayout5=d=540,11|710,11|880,11|1050,11|1220,11 net=1390,11 gpu=1590,11 size=1710,62


; ------------------------------------------------------------------------
; METERS - Disk Selector
; ------------------------------------------------------------------------

[HDSelectBackground]

